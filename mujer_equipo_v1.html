<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>La Liguilla de la Mujer Invisible · Equipo</title>
<style>
:root{--ink:#221a2e;--pur:#5b2a86;--pur2:#3d1a5c;--lila:#efe7f6;--gold:#f0b429;--red:#C8102E;--green:#1e8a4c;--bg:#f6f3f8;--muted:#6f6879;--border:#ddd5e4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.top{background:var(--pur2);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .t1{font-size:14px;font-weight:800;letter-spacing:.04em}.top .t2{font-size:11px;color:var(--gold)}
.me{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:24px;margin-bottom:8px}h2{font-size:19px;margin-bottom:8px}
p{line-height:1.45}.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
input{width:100%;border:2px solid var(--border);border-radius:10px;padding:12px;font-size:17px;font-family:inherit}
.btn{border:none;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:800;font-family:inherit;color:#fff;background:var(--pur);cursor:pointer;width:100%;margin-top:14px}
.btn:disabled{opacity:.4}
.err{color:var(--red);font-weight:700;margin-top:10px;min-height:18px}
.hidden{display:none!important}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.bloque{display:inline-block;background:var(--lila);color:var(--pur);font-weight:800;border-radius:20px;padding:4px 12px;font-size:13px;margin-bottom:8px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0}
.vs .n{font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px}.vs .n.r{justify-content:flex-end;text-align:right}
.vs .s{font-size:30px;font-weight:900}
.qtext{font-size:20px;font-weight:800;line-height:1.3;margin:6px 0 14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;border:none;border-radius:12px;padding:16px;font-size:17px;font-weight:700;color:#fff;margin-bottom:10px;text-align:left;font-family:inherit;cursor:pointer}
.opt .l{font-weight:900;background:rgba(255,255,255,.25);border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:none}
.o0{background:#c8102e}.o1{background:#1565c0}.o2{background:#d39200}.o3{background:#2e7d32}
.opt:disabled{cursor:default}.opt.dim{opacity:.25}.opt.sel{outline:5px solid #1b1b1b;outline-offset:-5px}
.clock{font-size:34px;font-weight:900;color:var(--pur);text-align:right}.clock.low{color:var(--red)}
.qhead{display:flex;justify-content:space-between;align-items:center}
.bar{height:8px;background:#ece8f0;border-radius:6px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--pur);transition:width .25s linear}
.res{border-radius:12px;padding:14px;font-size:19px;font-weight:800;text-align:center;margin-bottom:12px}
.res.ok{background:#e3f5ea;color:var(--green)}.res.ko{background:#fde7ea;color:var(--red)}.res.nn{background:#f1eef4;color:var(--muted)}
.expl{background:#fff8e5;border-left:6px solid var(--gold);border-radius:8px;padding:12px 14px;font-size:16px;line-height:1.4;margin-top:6px}
.big{font-size:22px;font-weight:800;text-align:center;margin:8px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{color:var(--muted);font-size:11px;padding:6px 3px;border-bottom:2px solid var(--border)}
.tbl td{padding:7px 3px;border-bottom:1px solid var(--border);text-align:center}.tbl td.n{text-align:left;font-weight:800}
.tbl tr.yo td{background:var(--lila)}
</style>
</head>
<body>
<div class="top"><div><div class="t1">LA LIGUILLA DE LA MUJER INVISIBLE</div><div class="t2">MICROMACHISMOS</div></div><div class="me hidden" id="me"></div></div>
<div class="wrap">
  <section id="sJoin" class="card">
    <h1>Entrar en la liguilla</h1>
    <label for="cCode">Código de la liguilla</label><input id="cCode" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800">
    <label for="cName">Nombre del equipo</label><input id="cName" maxlength="24" autocomplete="off">
    <button class="btn" id="bJoin">Entrar</button>
    <div class="err" id="joinErr"></div>
  </section>
  <section id="sGame" class="hidden"><div id="game"></div><div class="err" id="gameErr"></div></section>
</div>
<script>
const API = location.origin + "/api/mujer";
const LETRAS = ["A","B","C","D"];
const $ = id => document.getElementById(id);
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
async function api(p){ const r = await fetch(API, { method:"POST", body: JSON.stringify(p) }); const j = await r.json(); if (j.error) throw new Error(j.error); return j; }

const qs = new URLSearchParams(location.search);
let CODE = (qs.get("c") || lsGet("mujer_code", "") || "").toUpperCase();
let ME = CODE ? lsGet("mujer_team_" + CODE, null) : null;
let G = null, desfase = 0, clave = "", elegida = {};
function bloqueDe(r){ if (r < 0 || r >= G.rounds.length) return ""; return G.mezcla ? "Todos los bloques mezclados" : G.bloques[r]; }

$("cCode").value = CODE;
function ahora(){ return Date.now() + desfase; }
function equipo(id){ return (G && G.teams.find(x => x.id === id)) || { name:"?", color:"#999" }; }
function nm(id){ return esc(equipo(id).name); }
function dot(id){ return "<span class='dot' style='background:" + equipo(id).color + "'></span>"; }

$("bJoin").onclick = async () => {
  const c = $("cCode").value.trim().toUpperCase(), n = $("cName").value.trim();
  if (!c || !n){ $("joinErr").textContent = "Escribe el código y el nombre del equipo."; return; }
  $("bJoin").disabled = true;
  try{
    const r = await api({ a:"join", c, name:n });
    CODE = c; ME = r.team; lsSet("mujer_code", c); lsSet("mujer_team_" + c, ME);
    entrar();
  }catch(e){ $("joinErr").textContent = e.message === "Failed to fetch" ? "No se puede conectar con el servidor." : e.message; }
  $("bJoin").disabled = false;
};
function entrar(){
  $("sJoin").classList.add("hidden"); $("sGame").classList.remove("hidden");
  $("me").classList.remove("hidden"); $("me").innerHTML = "<span class='dot' style='background:" + ME.color + "'></span>" + esc(ME.name);
  bucle();
}

function tabla(){
  const t = {}; G.teams.forEach(e => t[e.id] = { id:e.id, name:e.name, color:e.color, pj:0, pf:0, pc:0, pts:0 });
  G.matches.filter(m => m.closed && !m.final).forEach(m => {
    const A = t[m.a], B = t[m.b]; if (!A || !B) return;
    A.pj++; B.pj++; A.pf += m.sa; A.pc += m.sb; B.pf += m.sb; B.pc += m.sa;
    if (m.sa > m.sb) A.pts += 3; else if (m.sb > m.sa) B.pts += 3; else { A.pts++; B.pts++; }
  });
  const o = Object.values(t).sort((x, y) => (y.pts - x.pts) || ((y.pf - y.pc) - (x.pf - x.pc)) || (y.pf - x.pf) || x.name.localeCompare(y.name));
  if (G.champ){ const i = o.findIndex(r => r.id === G.champ); if (i > 0) o.unshift(o.splice(i, 1)[0]); }
  return o;
}
function tablaHTML(){
  return "<table class='tbl'><thead><tr><th></th><th style='text-align:left'>Equipo</th><th>PJ</th><th>Dif</th><th>Pts</th></tr></thead><tbody>" +
    tabla().map((r, i) => "<tr class='" + (r.id === ME.id ? "yo" : "") + "'><td>" + (i+1) + "</td><td class='n'><span class='dot' style='background:" + r.color + "'></span> " + esc(r.name) + "</td><td>" + r.pj + "</td><td>" + (r.pf - r.pc) + "</td><td><b>" + r.pts + "</b></td></tr>").join("") + "</tbody></table>";
}
function miPartido(r){ return G.matches.find(m => m.r === r && (m.a === ME.id || m.b === ME.id)) || null; }
function rivalEn(r){ const ronda = G.rounds[r]; if (!ronda) return undefined; const p = ronda.find(x => x[0] === ME.id || x[1] === ME.id); if (!p) return undefined; return p[0] === ME.id ? p[1] : p[0]; }
function marcador(m){
  const yoA = m.a === ME.id, yo = yoA ? m.sa : m.sb, el = yoA ? m.sb : m.sa, riv = yoA ? m.b : m.a;
  return "<div class='vs'><div class='n'>" + dot(ME.id) + nm(ME.id) + "</div><div class='s'>" + yo + "–" + el + "</div><div class='n r'>" + nm(riv) + dot(riv) + "</div></div>";
}

function pintar(){
  const box = $("game"), r = G.round;
  if (G.status === "lobby"){
    const k = "lobby" + G.teams.length; if (clave === k) return; clave = k;
    box.innerHTML = "<div class='card'><h1>¡Dentro!</h1><p>Esperad a que la profesora sortee el calendario. Ya hay " + G.teams.length + (G.teams.length === 1 ? " equipo." : " equipos.") + "</p></div>";
    return;
  }
  const enPregunta = G.phase === "q" || G.phase === "rev";
  if (enPregunta && G.pregunta){
    const m = miPartido(r), q = G.pregunta, rev = G.phase === "rev";
    const mia = G.ans && G.ans[ME.id] ? G.ans[ME.id].o : (elegida[r + "_" + G.q] != null ? elegida[r + "_" + G.q] : null);
    const F = G.final, juegoFinal = F && F.vivos.includes(ME.id);
    const k = "q" + r + "_" + G.q + G.phase + mia + (m ? m.sa + "" + m.sb : "") + (F ? JSON.stringify(F.pts) + F.vivos.length : "");
    if (clave !== k){
      clave = k;
      const titulo = F ? "Desempate" : "Jornada " + (r + 1);
      const bloque = (F && G.sudden ? "Muerte súbita · " : "") + q.b;
      let h = "<div class='card'><div class='bloque'>" + esc(bloque) + "</div><div class='qhead'><b>" + titulo + " · Pregunta " + (G.q + 1) + "</b><div class='clock' id='clock'></div></div><div class='bar'><i id='barra'></i></div>";
      if (F) h += "<div style='margin:10px 0'>" + F.teams.map(id => "<div style='display:flex;justify-content:space-between;padding:4px 0;font-weight:800;" + (F.vivos.includes(id) ? "" : "opacity:.4") + "'><span>" + dot(id) + " " + nm(id) + "</span><span>" + F.pts[id] + "</span></div>").join("") + "</div>" + (juegoFinal ? "" : "<p class='muted'>" + (F.teams.includes(ME.id) ? "Ya no estáis en la muerte súbita." : "Mirad el desempate en el proyector.") + "</p>");
      else if (m) h += marcador(m); else h += "<p class='muted' style='margin:8px 0'>Esta jornada descansáis. Podéis leer las preguntas.</p>";
      if (rev && juegoFinal){
        const ult = F.h[F.h.length - 1];
        if (ult && ult.w === ME.id) h += "<div class='res ok'>¡Punto para vosotros!</div>";
        else if (ult && ult.w !== "-") h += "<div class='res ko'>" + (mia === q.c ? "Acertasteis, pero " + nm(ult.w) + " fue más rápido" : "Punto para " + nm(ult.w)) + "</div>";
        else h += "<div class='res nn'>" + (mia == null ? "No respondisteis a tiempo" : "Nadie acierta esta") + "</div>";
      }
      if (rev && m){
        const ult = m.h[m.h.length - 1], lado = m.a === ME.id ? "a" : "b";
        const acerte = mia === q.c;
        if (ult && ult.w === lado) h += "<div class='res ok'>¡Punto para vosotros!</div>";
        else if (ult && ult.w !== "-") h += "<div class='res ko'>" + (acerte ? "Acertasteis, pero " + nm(lado === "a" ? m.b : m.a) + " fue más rápido" : "Punto para " + nm(lado === "a" ? m.b : m.a)) + "</div>";
        else h += "<div class='res nn'>" + (mia == null ? "No respondisteis a tiempo" : "Fallasteis, y ellos tampoco acertaron") + "</div>";
      }
      h += "<div class='qtext'>" + esc(q.p) + "</div>";
      h += q.o.map((o, i) => {
        let c = "opt o" + i;
        if (rev) c += i === q.c ? " sel" : " dim";
        else if (mia != null) c += i === mia ? " sel" : " dim";
        return "<button class='" + c + "' data-i='" + i + "'" + ((rev || mia != null || (F ? !juegoFinal : !m)) ? " disabled" : "") + "><span class='l'>" + LETRAS[i] + "</span>" + esc(o) + "</button>";
      }).join("");
      if (!rev && mia != null) h += "<p class='muted' style='text-align:center'>Respuesta enviada. Esperad a que se cierre la pregunta.</p>";
      if (rev) h += "<div class='expl'>" + esc(q.e) + "</div>";
      h += "</div>";
      box.innerHTML = h;
      box.querySelectorAll(".opt:not([disabled])").forEach(b => b.onclick = () => responder(+b.dataset.i));
    }
    reloj();
    return;
  }
  // entre jornadas
  const k = "idle" + r + G.status + (G.champ || "");
  if (clave === k) return; clave = k;
  let h = "";
  if (G.status === "over"){
    const o = tabla(), pos = o.findIndex(x => x.id === ME.id) + 1;
    const emp = !G.champ && o.length > 1 && o[0].pts === o[1].pts;
    const empatados = emp ? o.filter(x => x.pts === o[0].pts).map(x => esc(x.name)) : [];
    h += "<div class='card'><h1>" + (G.champ === ME.id || (!emp && pos === 1) ? "🏆 ¡Sois campeones!" : emp ? "⚖️ Empate en cabeza" : "Liguilla terminada") + "</h1>" +
      "<p class='big'>Habéis quedado en el puesto " + pos + "</p>" + (emp ? "<p class='muted'>" + empatados.slice(0, -1).join(", ") + " y " + empatados[empatados.length - 1] + " jugarán un desempate.</p>" : "") + "</div>";
  } else {
    if (r >= 0){
      const m = miPartido(r);
      if (m){
        const yoA = m.a === ME.id, yo = yoA ? m.sa : m.sb, el = yoA ? m.sb : m.sa;
        h += "<div class='card'><div class='bloque'>" + esc(bloqueDe(r)) + "</div><h2>Jornada " + (r + 1) + " terminada</h2>" + marcador(m) +
          "<p class='big'>" + (yo > el ? "¡Victoria! +3 puntos" : yo < el ? "Derrota, 0 puntos" : "Empate, +1 punto") + "</p></div>";
      } else h += "<div class='card'><h2>Jornada " + (r + 1) + " terminada</h2><p>Esta jornada descansasteis.</p></div>";
    }
    const sig = r + 1;
    if (sig < G.rounds.length){
      const riv = rivalEn(sig);
      h += "<div class='card'><h2>Próxima jornada: " + (sig + 1) + " de " + G.rounds.length + "</h2>" +
        (riv ? "<p class='big'>Os toca contra</p><p class='big' style='font-size:28px'>" + dot(riv) + " " + nm(riv) + "</p>" : "<p class='big'>Esta jornada descansáis</p>") +
        "<p class='muted' style='text-align:center'>Empieza cuando la profesora dé paso.</p></div>";
    }
  }
  h += "<div class='card'><h2>Clasificación</h2>" + tablaHTML() + "</div>";
  box.innerHTML = h;
}

async function responder(i){
  const k = G.round + "_" + G.q;
  if (elegida[k] != null) return;
  elegida[k] = i; clave = ""; pintar();
  try{ await api({ a:"ans", c:CODE, t:ME.id, q:G.q, o:i }); }catch(e){ $("gameErr").textContent = e.message; }
}

function reloj(){
  if (!G || !$("clock")) return;
  const t = ahora();
  if (G.phase === "q"){
    const rest = Math.max(0, G.qStart + G.T_PREGUNTA - t);
    $("clock").textContent = Math.ceil(rest / 1000); $("clock").classList.toggle("low", rest < 5000);
    $("barra").style.width = (rest / G.T_PREGUNTA * 100) + "%";
  } else { $("clock").textContent = ""; $("barra").style.width = "0%"; }
}
setInterval(reloj, 250);

let activo = false;
async function refrescar(){
  try{
    const r = await fetch(API, { method:"POST", body: JSON.stringify({ a:"state", c:CODE, t:ME.id }) });
    const st = await r.json(); if (st.error) throw new Error(st.error);
    desfase = st.now - Date.now(); G = st; $("gameErr").textContent = "";
    if (!G.teams.find(x => x.id === ME.id)) throw new Error("No existe tu equipo");
    pintar();
  }catch(e){
    if (/No existe/.test(e.message)){ lsDel("mujer_team_" + CODE); ME = null; activo = false; $("sGame").classList.add("hidden"); $("sJoin").classList.remove("hidden"); $("me").classList.add("hidden"); $("joinErr").textContent = "Esa liguilla ya no existe o se ha quitado vuestro equipo. Volved a entrar."; return; }
    $("gameErr").textContent = "Conexión lenta, reintentando…";
  }
}
function bucle(){ if (activo) return; activo = true; (async function v(){ if (!ME){ activo = false; return; } await refrescar(); setTimeout(v, G && (G.phase === "q" || G.phase === "rev") ? 700 : 2000); })(); }

if (ME) entrar();
</script>
</body>
</html>
