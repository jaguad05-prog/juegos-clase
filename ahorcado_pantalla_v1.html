<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Ahorcado de los Medios · Pantalla</title>
<style>
:root{--red:#C8102E;--dark:#1B1B1F;--ink:#2B2B30;--gold:#E8B54A;--muted:#6B6B72;--border:#D8D8DC;--green:#1E7A45;--bg:#F5F5F7;--tint:#FBF1F2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.topbar{background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:10px;flex-wrap:wrap}
.tt{font-size:16px;font-weight:800;letter-spacing:.04em}
.ts{font-size:11px;color:var(--gold);letter-spacing:.06em}
.tr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{background:var(--red);color:#fff;font-weight:800;font-size:13px;padding:7px 14px;border-radius:20px}
.codebadge{background:#fff;color:var(--dark);font-weight:800;font-size:15px;padding:6px 12px;border-radius:8px;letter-spacing:.12em}
.tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 13px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:700}
.layout{display:grid;grid-template-columns:1fr 320px;gap:18px;padding:18px;max-width:1500px;margin:0 auto}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden}
.ph{background:var(--dark);color:#fff;padding:11px 16px;font-size:12.5px;font-weight:800;letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px}
.ph span{color:var(--gold)}
.pb{padding:20px}
.btn{border:none;padding:14px 22px;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.4;cursor:not-allowed}
.b-red{background:var(--red);color:#fff}.b-dark{background:var(--dark);color:#fff}.b-out{background:#fff;border:2px solid var(--border);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.err{color:var(--red);font-weight:700;margin-top:10px;min-height:18px}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
@media(max-width:700px){.lobby{grid-template-columns:1fr}}
.bigcode{font-size:64px;font-weight:900;letter-spacing:.14em;color:var(--dark)}
.link{font-size:15px;word-break:break-all;color:var(--muted);margin-top:6px}
#qr{background:#fff;padding:6px;border-radius:10px;border:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:2px solid var(--border);border-radius:30px;padding:7px 13px;font-weight:800;font-size:14px;background:#fff}
.chip.win{border-color:var(--green);background:#eef7f1;color:var(--green)}
.chip.dead{border-color:var(--red);background:#fdeceb;color:var(--red);text-decoration:line-through}
/* tarjeta del nombre */
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:15px;letter-spacing:.1em;padding:7px 14px;border-radius:20px}
.tag small{opacity:.8;font-weight:700;letter-spacing:.04em}
.who{font-size:clamp(44px,6vw,80px);font-weight:900;line-height:1.05;margin:14px 0 14px;color:var(--dark)}
.slots{display:flex;flex-wrap:wrap;gap:22px 34px;align-items:flex-end}
.word{display:flex;gap:8px}
.sl{width:clamp(34px,4vw,58px);height:clamp(48px,5.6vw,80px);border-bottom:6px solid var(--dark);display:flex;align-items:flex-end;justify-content:center;font-size:clamp(32px,4.4vw,64px);font-weight:900;color:var(--dark);padding-bottom:4px}
.sl.fixed{border-bottom-color:var(--border);color:var(--muted)}
.sl.on{color:var(--red)}
.stats{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap}
.stat b{display:block;font-size:44px;font-weight:900;color:var(--red);line-height:1}
.stat span{font-size:14px;font-weight:700;color:var(--muted)}
/* podio de la ronda */
.pod{display:flex;flex-direction:column;gap:10px}
.pr{display:flex;align-items:center;gap:14px;border:2px solid var(--border);border-radius:12px;padding:12px 16px;background:#fff;font-size:22px;font-weight:800}
.pr .m{font-size:30px;width:40px;text-align:center}
.pr .p{margin-left:auto;color:var(--red);font-size:26px;font-weight:900}
.compact{padding:12px 20px}.compact .pr{padding:7px 14px;font-size:19px}.compact .pr .m{font-size:24px}
.pr.empty{color:var(--muted);font-weight:400;font-style:italic;font-size:17px}
/* revelación */
.reveal{background:var(--dark);color:#fff;border-radius:16px;padding:30px 34px}
.reveal .who{color:#fff;margin:14px 0 6px}
.reveal .who em{font-style:normal;color:var(--gold)}
.reveal .lbl{font-size:15px;font-weight:800;letter-spacing:.12em;color:var(--gold);margin-top:22px}
.reveal .emp{font-size:clamp(36px,4.8vw,64px);font-weight:900;line-height:1.1;margin-top:6px}
@media (prefers-reduced-motion:no-preference){ .reveal{animation:pop .5s ease-out} @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}} }
/* clasificación */
.st{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:9px;padding:8px 10px;margin-bottom:7px}
.st .rk{width:26px;height:26px;border-radius:50%;background:var(--dark);color:var(--gold);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.st.top .rk{background:var(--gold);color:var(--dark)}
.st .nm{flex:1;font-weight:800;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .pt{font-size:19px;font-weight:900;color:var(--red)}
.adj{border:1px solid var(--border);background:#fff;border-radius:6px;width:22px;height:22px;cursor:pointer;font-weight:800;font-size:13px;line-height:1;padding:0}
.champ{background:linear-gradient(135deg,var(--gold),#f3d38a);border-radius:16px;padding:30px;text-align:center}
.champ .tr{font-size:52px;display:block}
.champ h3{font-size:13px;letter-spacing:.1em;margin:6px 0}
.champ .nm{font-size:44px;font-weight:900}
.podio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.podio div{background:#fff;border-radius:12px;padding:16px;text-align:center;font-weight:800;font-size:20px}
.podio b{display:block;color:var(--red);font-size:28px}
.empty{text-align:center;color:var(--muted);padding:20px;font-style:italic;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--red);color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="tt">EL AHORCADO DE LOS MEDIOS</div><div class="ts">QUIÉN MANDA EN CADA GRUPO DE COMUNICACIÓN</div></div>
  <div class="tr" id="tr"></div>
</div>
<div class="layout">
  <div class="col" id="main"></div>
  <div class="col" id="side"></div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const API = location.origin + "/api/ahorcado";
const PAGINA_JUGADOR = "ahorcado_jugador_v1.html";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const lsDel = k => { try { localStorage.removeItem(k); } catch(e){} };

let CODE = lsGet("ahor_code", ""), KEY = lsGet("ahor_key", ""), S = null, vista = "", pidiendo = false;

async function api(params){
  const r = await fetch(API, { method:"POST", body: JSON.stringify(Object.assign({ c: CODE, k: KEY }, params)) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 3200); }
async function accion(params){
  try { const j = await api(params); if (j.state){ S = j.state; pintar(); } }
  catch(e){ toast(e.message); }
}

function pintarInicio(){
  $("tr").innerHTML = "";
  $("side").innerHTML = "";
  $("main").innerHTML = `<div class="panel"><div class="ph">NUEVA PARTIDA</div><div class="pb">
    <p style="font-size:17px;line-height:1.5;margin-bottom:16px">Salen 16 nombres de quien manda en los grandes grupos de comunicación, primero televisión, luego prensa y después medios digitales. Cada alumno juega en su ordenador y adivina el apellido. El primero que lo resuelve suma 10 puntos, el segundo 5 y el tercero 3. Con tres aciertos se para la ronda y aquí se revela la empresa.</p>
    <button class="btn b-red" id="bCrear">Crear partida</button><div class="err" id="errCrear"></div></div></div>`;
  $("bCrear").onclick = async () => {
    try { const r = await fetch(API, { method:"POST", body: JSON.stringify({ a:"new" }) }); const j = await r.json(); if (j.error) throw new Error(j.error);
      CODE = j.code; KEY = j.admin; lsSet("ahor_code", CODE); lsSet("ahor_key", KEY); vista = ""; await refrescar(true); }
    catch(e){ $("errCrear").textContent = e.message || "No se ha podido crear la partida"; }
  };
}

async function refrescar(forzar){
  if (!CODE || (pidiendo && !forzar)) return;
  pidiendo = true;
  try { const j = await api({ a:"state" }); S = j; pintar(); }
  catch(e){ if (/No existe/.test(e.message)){ lsDel("ahor_code"); lsDel("ahor_key"); CODE = ""; pintarInicio(); } }
  finally { pidiendo = false; }
}
setInterval(() => { if (!document.hidden) refrescar(); }, 1200);

function urlJugador(){ const u = new URL(PAGINA_JUGADOR, location.href); u.searchParams.set("c", CODE); return u.toString(); }
function pintarQR(){
  try { const q = qrcode(0, "L"); q.addData(urlJugador()); q.make(); $("qr").innerHTML = q.createSvgTag({ cellSize:4, margin:2, scalable:true }); $("qr").querySelector("svg").setAttribute("style","width:240px;height:240px;display:block"); } catch(e){}
}

function pintar(){
  const g = S.game;
  $("tr").innerHTML = `<span class="codebadge">${esc(g.code)}</span>
    <span class="badge">${g.status === "lobby" ? "ESPERANDO" : g.status === "over" ? "FINAL" : "NOMBRE " + (g.round + 1) + " DE " + g.total}</span>
    ${g.status === "play" ? `<button class="tbtn" id="bRev" style="background:var(--red);border-color:var(--red)">Revelar ya</button>` : ""}
    <button class="tbtn" id="bNueva">Nueva partida</button>`;
  if ($("bRev")) $("bRev").onclick = () => { if (confirm("¿Revelar el apellido sin esperar a los tres aciertos?")) accion({ a:"reveal" }); };
  $("bNueva").onclick = () => { if (confirm("¿Empezar una partida nueva? Esta se pierde.")){ lsDel("ahor_code"); lsDel("ahor_key"); CODE = ""; KEY = ""; pintarInicio(); } };
  pintarClasificacion();
  const clave = g.status + "|" + g.round;
  if (g.status === "lobby") return pintarLobby(clave);
  if (g.status === "play") return pintarJuego(clave);
  if (g.status === "reveal") return pintarRevelacion(clave);
  if (g.status === "over") return pintarFinal(clave);
}

function pintarLobby(clave){
  const nombres = S.ranking.map(r => `<span class="chip">${esc(r.name)}</span>`).join("") || `<span class="muted">Todavía no ha entrado nadie</span>`;
  if (vista !== clave){
    vista = clave;
    $("main").innerHTML = `<div class="panel"><div class="ph">ENTRAD CADA UNO CON VUESTRO NOMBRE <span id="nJug"></span></div><div class="pb">
      <div class="lobby"><div id="qr"></div><div><div class="muted" style="font-weight:700">Código de la partida</div>
      <div class="bigcode">${esc(S.game.code)}</div><div class="link">${esc(urlJugador())}</div>
      <div class="row" style="margin-top:18px"><button class="btn b-red" id="bEmpezar">Sacar el primer nombre</button></div></div></div>
      <div class="chips" id="chips"></div></div></div>`;
    pintarQR();
    $("bEmpezar").onclick = () => accion({ a:"next" });
  }
  $("nJug").textContent = S.game.players + (S.game.players === 1 ? " jugador" : " jugadores");
  $("chips").innerHTML = nombres;
}

function huecos(plantilla, apellido){
  // plantilla: palabras con letras o null. Si hay apellido, se rellena entero.
  const palabras = apellido ? apellido.split(" ") : null;
  return `<div class="slots">${plantilla.map((w, i) => {
    const fija = w.every(ch => ch !== null) && !apellido;
    return `<div class="word">${w.map((ch, j) => {
      const letra = palabras ? palabras[i][j] : ch;
      return `<div class="sl${fija ? " fixed" : ""}${palabras ? " on" : ""}">${letra ? esc(letra) : ""}</div>`;
    }).join("")}</div>`;
  }).join("")}</div>`;
}

function podioRonda(){
  const m = ["🥇","🥈","🥉"], pts = [10,5,3];
  return `<div class="pod">${[0,1,2].map(i => {
    const w = S.game.winners[i];
    return w ? `<div class="pr"><span class="m">${m[i]}</span>${esc(w.name)}<span class="p">+${w.pts}</span></div>`
             : `<div class="pr empty"><span class="m" style="opacity:.35">${m[i]}</span>Nadie todavía · ${pts[i]} puntos</div>`;
  }).join("")}</div>`;
}

function pintarJuego(clave){
  const g = S.game, c = g.card;
  if (vista !== clave){
    vista = clave;
    $("main").innerHTML = `<div class="panel"><div class="ph">ADIVINA EL APELLIDO <span>con 6 fallos te ahorcan</span></div><div class="pb">
      <span class="tag">${esc(c.bloque.toUpperCase())} <small>· ${c.enBloque} de ${c.deBloque}</small></span>
      <div class="who">${esc(c.nombre)}</div>
      ${huecos(c.plantilla)}
      <div class="stats"><div class="stat"><b id="sJug">0</b><span>jugando</span></div><div class="stat"><b id="sRes">0</b><span>lo han resuelto</span></div><div class="stat"><b id="sAho">0</b><span>ahorcados</span></div></div>
    </div></div>
    <div class="panel"><div class="ph">LOS TRES PRIMEROS <span>la ronda se para con el tercero</span></div><div class="pb compact" id="podio"></div></div>`;
  }
  $("sJug").textContent = Math.max(0, g.players - g.solved - g.hanged);
  $("sRes").textContent = g.solved;
  $("sAho").textContent = g.hanged;
  $("podio").innerHTML = podioRonda();
}

function pintarRevelacion(clave){
  const g = S.game, c = g.card;
  if (vista === clave) return;
  vista = clave;
  const ultimo = g.round + 1 >= g.total;
  $("main").innerHTML = `<div class="reveal">
      <span class="tag">${esc(c.bloque.toUpperCase())}</span>
      <div class="who">${esc(c.nombre)} <em>${esc(c.apellido)}</em></div>
      <div class="lbl">MANDA EN</div>
      <div class="emp">${c.empresas.map(esc).join(" y ")}</div>
    </div>
    <div class="panel"><div class="ph">PUNTOS DE ESTE NOMBRE</div><div class="pb">${podioRonda()}</div></div>
    <div class="row"><button class="btn b-red" id="bSig">${ultimo ? "Ver la clasificación final" : "Siguiente nombre"}</button></div>`;
  $("bSig").onclick = () => accion({ a:"next" });
}

function pintarFinal(clave){
  if (vista === clave) return;
  vista = clave;
  const r = S.ranking;
  const top = r[0];
  $("main").innerHTML = top ? `<div class="champ"><span class="tr">🏆</span><h3>GANA EL AHORCADO DE LOS MEDIOS</h3><div class="nm">${esc(top.name)}</div><div style="font-size:22px;font-weight:800;margin-top:6px">${top.pts} puntos</div>
      <div class="podio">${r.slice(1,3).map((x,i) => `<div>${i === 0 ? "🥈" : "🥉"} ${esc(x.name)}<b>${x.pts}</b></div>`).join("")}</div></div>`
    : `<div class="panel"><div class="pb empty">No ha jugado nadie</div></div>`;
}

function pintarClasificacion(){
  const r = S.ranking;
  $("side").innerHTML = `<div class="panel"><div class="ph">CLASIFICACIÓN <span>${r.length}</span></div><div class="pb" style="padding:12px">
    ${r.length ? r.map((x, i) => `<div class="st${i < 3 && x.pts > 0 ? " top" : ""}"><div class="rk">${i + 1}</div><div class="nm">${esc(x.name)}</div>
      <button class="adj" data-t="${x.id}" data-d="-1" title="Quitar un punto">−</button><div class="pt">${x.pts}</div><button class="adj" data-t="${x.id}" data-d="1" title="Sumar un punto">+</button></div>`).join("")
      : `<div class="empty">Aquí saldrán los jugadores</div>`}</div></div>`;
  $("side").querySelectorAll(".adj").forEach(b => b.onclick = () => accion({ a:"adjust", t:b.dataset.t, d:b.dataset.d }));
}

if (CODE && KEY) refrescar(true); else pintarInicio();
</script>
</body>
</html>
