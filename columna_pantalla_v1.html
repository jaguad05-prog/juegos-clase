<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis de columna · Proyector</title>
<style>
:root{--red:#C8102E;--ink:#1B1B1F;--paper:#fff;--bg:#F3F1EC;--muted:#6B6B72;--border:#D8D8DC;--green:#1E7A45;--gold:#E8B54A;--lgreen:#E8F5EC;--lred:#FBE9EC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);height:100%}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
header{background:var(--ink);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:20px}
header .t1{font-size:22px;font-weight:900;letter-spacing:.03em}
header .t2{font-size:13px;color:var(--gold);letter-spacing:.06em;margin-top:3px}
header .sp{flex:1}
header .code{font-size:15px;color:#ccc}
header .code b{color:#fff;font-size:22px;letter-spacing:.12em;margin-left:6px}
main{padding:24px 28px;max-width:1500px;margin:0 auto}
.box{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:22px 26px}
.btn{border:none;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:800;font-family:inherit;color:#fff;background:var(--red);cursor:pointer}
.btn.out{background:#fff;color:var(--ink);border:2px solid var(--border)}
.btn.green{background:var(--green)}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
h1{font-size:34px;line-height:1.15}
h2{font-size:24px}
.muted{color:var(--muted)}
.lobby{display:grid;grid-template-columns:420px 1fr;gap:24px;align-items:start}
#qr svg{width:100%;height:auto}
.bigcode{font-size:64px;font-weight:900;letter-spacing:.14em;text-align:center;margin-top:8px}
.link{font-size:14px;color:var(--muted);text-align:center;word-break:break-all}
.teams{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tm{background:#fff;border:2px solid var(--border);border-radius:12px;padding:10px 14px;font-weight:800;font-size:18px}
.qhead{display:flex;align-items:center;gap:24px}
.qhead .info{flex:1}
.num{font-size:15px;font-weight:800;color:var(--red);letter-spacing:.06em}
.clock{font-size:96px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.clock.low{color:var(--red)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px}
.casl{list-style:none}
.casl li{display:flex;gap:12px;align-items:flex-start;font-size:21px;font-weight:700;padding:10px 0;border-bottom:1px solid var(--border);line-height:1.3}
.casl li .n{min-width:34px;height:34px;border-radius:17px;background:var(--ink);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.casl li .pt{margin-left:auto;font-size:15px;color:var(--muted);flex:none;padding-top:6px}
.tstat{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:19px;font-weight:700}
.tstat .bar{flex:1;margin:0 14px;height:10px;background:#ececef;border-radius:5px;overflow:hidden}
.tstat .bar i{display:block;height:100%;background:var(--gold)}
.tstat .ok{color:var(--green);font-weight:900}
.rgrid{display:grid;grid-template-columns:430px 1fr;gap:22px;margin-top:6px;align-items:start}
.cl{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:20px}
.cl .p{width:36px;font-weight:900;color:var(--muted)}
.cl .nm{flex:1;font-weight:800}
.cl .rd{color:var(--green);font-weight:800;font-size:16px}
.cl .tt{font-weight:900;font-size:24px;min-width:56px;text-align:right}
.cl.top1 .p{color:var(--gold)}
.soltabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.soltabs button{border:2px solid var(--border);background:#fff;border-radius:10px;padding:8px 14px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.soltabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.solt{font-size:24px;font-weight:800;line-height:1.3}
.media{font-size:15px;color:var(--muted);margin-top:4px}
.sitem{font-size:20px;line-height:1.4;padding:10px 14px;border-radius:10px;margin-top:10px;background:var(--lgreen);color:#14532d}
.sitem.neg{background:var(--lred);color:#8a1022}
.sexp{font-size:20px;line-height:1.45;margin-top:16px;border-left:5px solid var(--gold);padding-left:14px}
.podio{display:flex;justify-content:center;align-items:flex-end;gap:20px;margin:30px 0}
.pd{background:#fff;border:2px solid var(--border);border-radius:16px;padding:18px 26px;text-align:center;min-width:240px}
.pd .pp{font-size:56px;font-weight:900}
.pd .pn{font-size:26px;font-weight:900;margin-top:6px}
.pd .pt{font-size:18px;color:var(--muted);margin-top:4px}
.pd.g1{border-color:var(--gold);padding-bottom:50px}
.mins{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:700;margin-top:18px}
.mins input{width:84px;font-size:20px;font-weight:800;padding:8px;border:2px solid var(--border);border-radius:10px;text-align:center;font-family:inherit}
.err{color:var(--red);font-weight:700;margin-top:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><div><div class="t1">ANÁLISIS DE COLUMNA</div><div class="t2">PERIODISMO DEPORTIVO · LA OPINIÓN</div></div><div class="sp"></div><div class="code" id="hcode"></div></header>
<main id="main"><div class="box"><p class="muted">Cargando…</p></div></main>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const API = location.origin + "/api/columna";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const LET = "ABCDEFGH";

let CODE = lsGet("columna_p_code", ""), KEY = lsGet("columna_p_key", "");
let MIN = Number(lsGet("columna_p_min", "3")) || 3;
const minsHTML = () => `<div class="mins">Minutos para contestar <input type="number" id="imin" min="0.5" max="15" step="0.5" value="${MIN}" onchange="ponMin(this.value)"></div>`;
function ponMin(v){ const n = Number(String(v).replace(",", ".")); if (n >= 0.5 && n <= 15){ MIN = n; lsSet("columna_p_min", String(n)); } else { toast("Pon entre 0,5 y 15 minutos"); const i = $("imin"); if (i) i.value = MIN; } }
let D = null, S = null, offset = 0, vista = "", solCas = 0, solQ = -1;

function toast(m){ const t = $("toast"); t.textContent = m; t.className = "on"; clearTimeout(t._h); t._h = setTimeout(() => t.className = "", 3500); }
async function api(params){
  const r = await fetch(API, { method:"POST", body: JSON.stringify(Object.assign({ c: CODE, k: KEY }, params)) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}
const urlEquipo = () => location.origin + "/columna_equipo_v1.html?c=" + CODE;
const maxPreg = q => q.cas.reduce((s, c) => s + c.max, 0);

function pintarInicio(msg){
  vista = "inicio"; $("hcode").innerHTML = "";
  $("main").innerHTML = `<div class="box" style="max-width:640px"><h1>Nueva partida</h1>
    <p class="muted" style="margin-top:10px;font-size:18px">Cinco preguntas sobre cuatro columnas tras el España-Francia. Los equipos contestan desde el móvil y la puntuación sale sola al acabar el tiempo.</p>
    <div class="btns"><button class="btn" id="bn">Crear partida</button></div><div class="err">${esc(msg || "")}</div></div>`;
  $("bn").onclick = async () => {
    $("bn").disabled = true;
    try { const j = await api({ a:"new" }); CODE = j.code; KEY = j.admin; lsSet("columna_p_code", CODE); lsSet("columna_p_key", KEY); vista = ""; refrescar(); }
    catch(e){ toast(e.message); $("bn").disabled = false; }
  };
}
async function accion(a, extra){ try { await api(Object.assign({ a }, extra || {})); refrescar(); } catch(e){ toast(e.message); } }
function nueva(){ if (confirm("¿Empezar una partida nueva? Los equipos tendrán que entrar con el código nuevo.")){ CODE = ""; KEY = ""; lsSet("columna_p_code", ""); pintarInicio(); } }

function pintarLobby(){
  const firma = "lobby" + S.teams.map(t => t.name).join("|");
  if (vista === firma) return; vista = firma;
  $("main").innerHTML = `<div class="lobby">
    <div class="box"><div id="qr"></div><div class="bigcode">${esc(CODE)}</div><div class="link">${esc(urlEquipo())}</div></div>
    <div class="box"><h1>Entrad con un móvil por equipo</h1>
      <p class="muted" style="font-size:18px;margin-top:8px">Escanead el QR o entrad en la dirección con el código.</p>
      <h2 style="margin-top:22px">${S.teams.length} ${S.teams.length === 1 ? "equipo dentro" : "equipos dentro"}</h2>
      <div class="teams">${S.teams.map(t => `<div class="tm">${esc(t.name)}</div>`).join("") || `<p class="muted">Todavía no ha entrado nadie</p>`}</div>
      ${minsHTML()}
      <div class="btns"><button class="btn" onclick="accion('start',{q:0,min:MIN})">Empezar la pregunta 1</button><button class="btn out" onclick="nueva()">Nueva partida</button></div></div></div>`;
  try { const q = qrcode(0, "M"); q.addData(urlEquipo()); q.make(); $("qr").innerHTML = q.createSvgTag({ cellSize:6, margin:1, scalable:true }); } catch(e){}
}

function cabPregunta(q){
  const m = q.col !== null ? D.meta[q.col] : null;
  return `<div class="num">PREGUNTA ${S.q + 1} DE ${S.nq}</div><h1>${esc(m ? m.autor : q.t)}</h1>
    <p class="muted" style="font-size:18px;margin-top:4px">${m ? "«" + esc(m.titulo) + "»" + (m.medio ? " · " + esc(m.medio) : "") : "Pensad en las cuatro columnas a la vez"}</p>`;
}
function pintarLectura(){
  const q = D.preg[S.q];
  if (vista !== "l" + S.q){
    vista = "l" + S.q;
    $("main").innerHTML = `<div class="box"><div class="qhead"><div class="info">${cabPregunta(q)}</div><div class="clock" style="font-size:44px">Lectura</div></div></div>
      <div class="box" style="margin-top:20px"><h2>Leed la columna en el móvil</h2>
      <p class="muted" style="font-size:18px;margin-top:6px">Cuando hayan terminado, abre las casillas. Entonces empieza el tiempo para contestar.</p>
      <div class="teams" id="lteams"></div>
      ${minsHTML()}
      <div class="btns"><button class="btn" onclick="accion('go',{min:MIN})">Empezar a contestar</button></div></div>`;
  }
  $("lteams").innerHTML = S.teams.map(t => `<div class="tm">${esc(t.name)}</div>`).join("");
}
function pintarPregunta(){
  const q = D.preg[S.q], nc = q.cas.length;
  if (vista !== "q" + S.q){
    vista = "q" + S.q;
    $("main").innerHTML = `<div class="box"><div class="qhead"><div class="info">${cabPregunta(q)}</div><div class="clock" id="clock"></div></div></div>
      <div class="qgrid"><div class="box"><h2>Las casillas</h2><ul class="casl">${q.cas.map((c, i) => `<li><span class="n">${i + 1}</span><span>${esc(c.t)}</span><span class="pt">${c.max} ${c.max === 1 ? "punto" : "puntos"}</span></li>`).join("")}</ul></div>
      <div class="box"><h2>Los equipos</h2><div id="tst"></div>
      <div class="btns"><button class="btn out" onclick="accion('extend',{s:60})">+1 minuto</button><button class="btn" onclick="if(confirm('¿Cerrar ya la pregunta y puntuar?'))accion('close')">Cerrar ya y puntuar</button></div></div></div>`;
  }
  $("tst").innerHTML = S.teams.map(t => `<div class="tstat"><span>${esc(t.name)}</span><span class="bar"><i style="width:${Math.round(100 * t.tocadas / nc)}%"></i></span>${t.done ? `<span class="ok">Terminado ✓</span>` : `<span class="muted">${t.tocadas} de ${nc}</span>`}</div>`).join("");
  reloj();
}

function solucionHTML(q, ci){
  const c = q.cas[ci], so = S.sol[ci];
  let h = `<div class="solt">${ci + 1}. ${esc(c.t)}</div><div class="media">Media de la clase ${String(S.medias[ci]).replace(".", ",")} de ${c.max}</div>`;
  if (c.tipo === "toca"){
    h += so.ok.map(i => `<div class="sitem">«${esc(D.cols[q.col][i])}»</div>`).join("");
  } else if (c.tipo === "elige"){
    h += `<div class="sitem">${LET[so.ok]}. ${esc(c.ops[so.ok])}</div>`;
  } else if (c.tipo === "varias"){
    h += so.ok.map(i => `<div class="sitem">${esc(c.ops[i])}</div>`).join("");
  } else if (c.tipo === "empareja"){
    h += c.filas.map((f, i) => `<div class="sitem">${esc(f)} → ${esc(c.ops[so.ok[i]])}</div>`).join("");
  }
  return h + `<div class="sexp">${esc(so.porque)}</div>`;
}
function pintarResultados(){
  const q = D.preg[S.q];
  if (solQ !== S.q){ solQ = S.q; solCas = 0; }
  if (vista === "r" + S.q + "|" + solCas) return;
  vista = "r" + S.q + "|" + solCas;
  const ultima = S.q >= S.nq - 1;
  $("main").innerHTML = `<div class="box" style="margin-bottom:18px">${cabPregunta(q)}</div>
    <div class="rgrid"><div class="box"><h2>Clasificación</h2><p class="muted" style="margin:4px 0 8px">En verde, lo ganado en esta pregunta (máximo ${maxPreg(q)})</p>
      ${S.clas.map(x => `<div class="cl ${x.pos === 1 ? "top1" : ""}"><span class="p">${x.pos}º</span><span class="nm">${esc(x.name)}</span><span class="rd">+${x.ronda}</span><span class="tt">${x.total}</span></div>`).join("")}
      ${ultima ? "" : minsHTML()}
      <div class="btns">${ultima ? `<button class="btn" onclick="accion('final')">Clasificación final</button>` : `<button class="btn" onclick="accion('start',{min:MIN})">Pregunta ${S.q + 2}</button>`}</div></div>
    <div class="box"><div class="soltabs">${q.cas.map((c, i) => `<button class="${i === solCas ? "on" : ""}" onclick="solCas=${i};vista='';pintarResultados()">Casilla ${i + 1}</button>`).join("")}</div>
      ${solucionHTML(q, solCas)}</div></div>`;
}
function pintarFinal(){
  if (vista === "fin") return; vista = "fin";
  const c = S.clas, p = n => c.filter(x => x.pos === n);
  const pd = (arr, n, cls) => arr.length ? `<div class="pd ${cls}"><div class="pp">${n}º</div><div class="pn">${arr.map(x => esc(x.name)).join(" · ")}</div><div class="pt">${arr[0].total} puntos</div></div>` : "";
  const segundos = p(2), terceros = p(3);
  $("main").innerHTML = `<div class="box center" style="text-align:center"><h1>Clasificación final</h1>
    <div class="podio">${pd(segundos, 2, "")}${pd(p(1), 1, "g1")}${pd(terceros, 3, "")}</div></div>
    <div class="box" style="margin-top:18px">${c.map(x => `<div class="cl"><span class="p">${x.pos}º</span><span class="nm">${esc(x.name)}</span><span class="tt">${x.total}</span></div>`).join("")}
    <div class="btns"><button class="btn out" onclick="nueva()">Nueva partida</button></div></div>`;
}

function reloj(){
  const el = $("clock"); if (!el || !S || S.status !== "q") return;
  const s = Math.ceil(Math.max(0, S.deadline - (Date.now() + offset)) / 1000);
  el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  el.className = "clock" + (s <= 30 ? " low" : "");
}
setInterval(reloj, 250);

function render(){
  $("hcode").innerHTML = CODE ? `Código<b>${esc(CODE)}</b>` : "";
  if (S.status === "lobby") pintarLobby();
  else if (S.status === "l") pintarLectura();
  else if (S.status === "q") pintarPregunta();
  else if (S.status === "r") pintarResultados();
  else if (S.status === "fin") pintarFinal();
}
let pidiendo = false;
async function refrescar(){
  if (!CODE){ if (vista !== "inicio") pintarInicio(); return; }
  if (pidiendo) return; pidiendo = true;
  try { const j = await api({ a:"state" }); offset = j.now - Date.now(); S = j; render(); }
  catch(e){ if (/No existe/.test(e.message)){ CODE = ""; pintarInicio(e.message); } }
  pidiendo = false;
}
(async () => {
  try { const r = await fetch(API, { method:"POST", body: JSON.stringify({ a:"datos" }) }); D = await r.json(); }
  catch(e){ $("main").innerHTML = `<div class="box"><p>No se puede conectar con el servidor. Recarga en unos segundos.</p></div>`; return; }
  await refrescar();
  setInterval(refrescar, 1500);
})();
</script>
</body>
</html>
