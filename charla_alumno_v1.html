<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>El Titular de la Charla</title>
<style>
:root{--red:#C8102E;--ink:#1B1B1F;--paper:#fff;--bg:#F3F1EC;--muted:#6B6B72;--border:#D8D8DC;--green:#1E7A45;--gold:#E8B54A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
.top{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
.t1{font-size:14px;font-weight:800;letter-spacing:.04em}
.t2{font-size:11px;color:var(--gold);letter-spacing:.06em}
.chip{font-weight:800;font-size:14px;text-align:right}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:23px;line-height:1.2;margin-bottom:8px}
h2{font-size:18px;line-height:1.3;margin-bottom:10px}
p{line-height:1.45}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input,textarea{width:100%;border:2px solid var(--border);border-radius:10px;padding:13px;font-size:17px;font-family:inherit;color:var(--ink);background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--red)}
textarea{min-height:110px;resize:vertical;line-height:1.4}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:16px;font-size:18px;font-weight:800;font-family:inherit;color:#fff;background:var(--red);cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.45}
.btn.out{background:#fff;color:var(--ink);border:2px solid var(--border);font-size:15px;padding:12px}
.err{color:var(--red);font-weight:700;font-size:14px;margin-top:10px;min-height:18px}
.topic{border-left:5px solid var(--red);padding-left:14px;font-size:17px;font-weight:700;line-height:1.35}
.mine{background:#fff;border:2px solid var(--green);border-radius:12px;padding:14px;font-size:19px;font-weight:800;line-height:1.3}
.count{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--border);border-radius:12px;padding:14px;background:#fff;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;margin-bottom:10px;line-height:1.3}
.opt .L{min-width:36px;height:36px;border-radius:18px;padding:0 6px;background:var(--ink);color:var(--gold);font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.opt.sel{border-color:var(--green);background:#eef7f1}
.opt.sel .L{background:var(--green);color:#fff}
.opt.own{opacity:.55;cursor:not-allowed;background:#f0eee9}
.res{border:2px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;background:#fff}
.res.me{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.res .who{font-size:12px;font-weight:800;color:var(--muted)}
.res .h{font-size:16px;font-weight:700;margin-top:2px;line-height:1.3}
.res .p{margin-left:auto;font-size:22px;font-weight:900;color:var(--red);flex:none}
.big{font-size:44px;text-align:center;margin:6px 0}
.center{text-align:center}
.small{font-size:12px;color:var(--muted);margin-top:16px;text-align:center}
.small a{color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <div><div class="t1">EL TITULAR DE LA CHARLA</div><div class="t2">ESCRIBE · VOTA · GANA</div></div>
  <div class="chip" id="chip"></div>
</div>
<div class="wrap" id="app"></div>

<script>
const API = location.origin + "/api/charla";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const qs = new URLSearchParams(location.search);

let CODE = (qs.get("c") || lsGet("charla_code", "")).toUpperCase();
let DEV = lsGet("charla_dev", "");
if (!DEV){ DEV = "d" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet("charla_dev", DEV); }
let unido = lsGet("charla_joined", "") === CODE && !!CODE;
let S = null, vista = "", ocupado = false, editando = false, modoEditar = false, fase = "";

async function api(params){
  const r = await fetch(API, { method:"POST", body: JSON.stringify(Object.assign({ c: CODE, dev: DEV }, params)) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function pintarEntrada(msg){
  $("chip").textContent = "";
  $("app").innerHTML = `<div class="card">
    <h1>Entra en la sala</h1>
    <p class="muted">Pon tu nombre y el código que ves en la pantalla. Tu nombre solo aparece si quedas entre los tres primeros.</p>
    <label>Código</label><input id="inCode" value="${esc(CODE)}" maxlength="6" autocapitalize="characters" placeholder="Lo ves en la pantalla">
    <label>Tu nombre</label><input id="inName" value="${esc(lsGet("charla_name", ""))}" maxlength="40" placeholder="Nombre y apellido">
    <button class="btn" id="btnJoin">Entrar</button>
    <div class="err" id="err">${esc(msg || "")}</div></div>`;
  $("btnJoin").onclick = entrar;
}
async function entrar(){
  CODE = $("inCode").value.trim().toUpperCase();
  const name = $("inName").value.trim();
  if (!CODE || !name){ $("err").textContent = "Rellena el código y tu nombre"; return; }
  $("btnJoin").disabled = true; $("btnJoin").textContent = "Entrando…";
  try {
    await api({ a:"join", name });
    lsSet("charla_code", CODE); lsSet("charla_name", name); lsSet("charla_joined", CODE);
    unido = true; vista = ""; await refrescar();
  } catch(e){ $("err").textContent = e.message; $("btnJoin").disabled = false; $("btnJoin").textContent = "Entrar"; }
}

let pidiendo = false;
async function refrescar(){
  if (!unido || pidiendo) return;
  pidiendo = true;
  try {
    S = await api({ a:"state" });
    if (!S.me){ unido = false; pintarEntrada("Vuelve a entrar con tu nombre"); return; }
    pintar();
  } catch(e){ if (/No existe/.test(e.message)){ unido = false; pintarEntrada(e.message); } }
  finally { pidiendo = false; }
}
setInterval(refrescar, 1800 + Math.floor(Math.random() * 600));

async function hacer(params){
  if (ocupado) return;
  ocupado = true; let err = "";
  try { await api(params); } catch(e){ err = e.message; }
  ocupado = false; vista = ""; await refrescar();
  if (err){ const el = $("err"); if (el) el.textContent = err; }
  return !err;
}

function pintar(){
  const g = S.game, me = S.me;
  $("chip").textContent = me.name;
  const f = g.status + g.round;
  if (f !== fase){ fase = f; editando = false; modoEditar = false; }
  else if (g.status === "write" && editando) return;   // no se repinta mientras escribes
  const clave = JSON.stringify([modoEditar, g.status, g.round, g.topic, me.head, me.voted, S.heads && S.heads.map(h => h.n + h.text), S.last && S.last.round]);
  if (clave === vista) return;
  vista = clave;

  const tema = g.topic ? `<div class="topic">${esc(g.topic)}</div>` : "";
  let html = "";

  if (g.status === "write"){
    if (me.head && !modoEditar){
      html = `<div class="card"><h2>Tu titular ya está en la pantalla</h2>
        <div class="mine">${esc(me.head)}</div>
        <button class="btn out" id="btnEdit">Corregirlo</button>
        <p class="muted" style="margin-top:14px">Cuando se abra la votación, aquí verás todos los titulares.</p></div>`;
    } else {
      html = editor(me.head || "");
    }
  } else if (g.status === "vote"){
    const lista = S.heads.map(h => {
      const cls = h.mine ? "opt own" : (me.voted === h.n ? "opt sel" : "opt");
      return `<button class="${cls}" ${h.mine ? "disabled" : `onclick="votar(${h.n})"`}><span class="L">${h.n}</span><span>${esc(h.text)}${h.mine ? ' <small style="font-weight:400">(el tuyo)</small>' : ""}</span></button>`;
    }).join("");
    html = `<div class="card"><h2>${me.voted ? "Has votado el " + me.voted + ". Puedes cambiar el voto hasta que se cierre." : "Vota el mejor titular"}</h2>
      <p class="muted" style="margin-bottom:12px">Un voto por persona, el tuyo no se puede votar.</p>
      <div class="err" id="err"></div>${lista}</div>`;
  } else if (g.status === "results"){
    const L = S.last, mio = me.head;
    const podio = L.results.map((r, i) => {
      const esMio = mio && r.text === mio;
      const quien = i < 3 && r.votes > 0 ? `${["🥇","🥈","🥉"][i]} ${esc(r.name)}` : `N.º ${r.n}`;
      return `<div class="res ${esMio ? "me" : ""}"><div><div class="who">${quien}${esMio ? " · el tuyo" : ""}</div><div class="h">${esc(r.text)}</div></div><div class="p">${r.votes}</div></div>`;
    }).join("");
    html = `<div class="card"><h2>Resultados</h2>${podio}</div>`;
  }
  $("app").innerHTML = `<div class="card">${tema || '<p class="muted">Escribe el titular de la charla que estás escuchando.</p>'}</div>` + html +
    `<div class="small">${esc(me.name)} · <a href="#" onclick="salir();return false">no soy yo</a></div>`;

  if ($("btnEdit")) $("btnEdit").onclick = () => { modoEditar = true; vista = ""; pintar(); editando = true; };
  conectarEditor();
}

function editor(txt){
  return `<div class="card"><h2>Escribe tu titular</h2>
    <textarea id="txt" maxlength="160" placeholder="Tu titular sobre la charla">${esc(txt)}</textarea>
    <div class="count" id="cnt">${txt.length}/160</div>
    <button class="btn" id="btnSend">Enviar a la pantalla</button>
    <div class="err" id="err"></div></div>`;
}
function conectarEditor(){
  const t = $("txt"); if (!t) return;
  t.oninput = () => { $("cnt").textContent = t.value.length + "/160"; editando = true; };
  t.onfocus = () => { editando = true; };
  $("btnSend").onclick = async () => {
    const v = t.value.trim();
    if (!v){ $("err").textContent = "Escribe algo antes de enviar"; return; }
    $("btnSend").disabled = true; $("btnSend").textContent = "Enviando…";
    editando = false;
    const ok = await hacer({ a:"send", text: v });
    if (ok){ modoEditar = false; vista = ""; pintar(); }
    else if ($("btnSend")){ $("btnSend").disabled = false; $("btnSend").textContent = "Enviar a la pantalla"; }
  };
}
function votar(n){ hacer({ a:"vote", n }); }
function salir(){ unido = false; lsSet("charla_joined", ""); S = null; pintarEntrada(); }

if (unido) refrescar(); else pintarEntrada();
</script>
</body>
</html>
