<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordena la crónica</title>
<style>
:root{--red:#C8102E;--dark:#1B1B1F;--ink:#2B2B30;--gold:#E8B54A;--muted:#6B6B72;--border:#D8D8DC;--green:#1E7A45;--greenbg:#E9F6EE;--redbg:#FDECEB;--bg:#F5F5F7;--paper:#FFFDF8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
.topbar{background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px;flex:none}
.tt{font-size:15px;font-weight:800;letter-spacing:.04em}
.ts{font-size:11px;color:var(--gold);letter-spacing:.06em}
.me{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:700;color:var(--gold)}
.me b{color:#fff}
.clock{background:#fff;color:var(--dark);font-weight:900;font-size:18px;padding:5px 12px;border-radius:8px;font-variant-numeric:tabular-nums;min-width:78px;text-align:center}
.wrap{max-width:560px;margin:30px auto;padding:0 16px;width:100%}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
input{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:12px;font-size:17px;font-family:inherit;-webkit-user-select:text;user-select:text}
.btn{border:none;padding:13px 20px;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.b-red{background:var(--red);color:#fff}
.err{color:var(--red);font-weight:700;margin-top:10px;min-height:18px}
.wait{text-align:center;padding:40px 20px;font-size:19px;line-height:1.5}
.muted{color:var(--muted)}
/* tablero */
.board{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}
.col{display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.ch{background:var(--dark);color:#fff;padding:10px 14px;font-size:12.5px;font-weight:800;letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px;flex:none}
.ch span{color:var(--gold)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.cab{background:var(--paper);border:1px solid #EEE7D8;border-radius:10px;padding:14px 16px}
.cab .medio{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--red);text-transform:uppercase}
.cab h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,2.2vw,28px);line-height:1.15;margin:4px 0 6px;color:var(--dark)}
.cab p{font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.4;color:#444;font-style:italic}
.pool{display:flex;flex-direction:column;gap:10px;min-height:120px;border-radius:10px;padding:2px}
.pool.over{outline:3px dashed var(--gold);outline-offset:3px}
.vacio{border:2px dashed var(--border);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.blk{white-space:pre-line;position:relative;background:#fff;border:2px solid var(--border);border-radius:10px;padding:10px 12px 10px 46px;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.45;cursor:grab;touch-action:none;transition:border-color .15s,box-shadow .15s}
.blk:hover{border-color:var(--dark)}
.blk .lt{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--dark);color:var(--gold);font-family:Arial,sans-serif;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.blk.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,181,74,.45)}
.blk.ghost{opacity:.35}
.blk.ok{border-color:var(--green);background:var(--greenbg);cursor:default}
.blk.ok .lt{background:var(--green);color:#fff}
.blk.ko{border-color:var(--red);background:var(--redbg)}
.blk.ko .lt{background:var(--red);color:#fff}
.drag{position:fixed;z-index:50;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:rotate(-1.2deg);opacity:.95;max-height:220px;overflow:hidden}
.slot{border:2px dashed var(--border);border-radius:12px;padding:8px;background:#FAFAFB;transition:background .15s,border-color .15s}
.slot .sh{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.slot .n{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.slot .lb{font-weight:800;font-size:14px;color:var(--dark)}
.slot .ph{border-radius:8px;padding:16px;text-align:center;color:#A0A0A8;font-size:13.5px}
.slot.over{border-color:var(--gold);background:#FFF8E8;border-style:solid}
.slot.target{border-color:var(--gold)}
.slot.ok{border-color:var(--green);border-style:solid;background:var(--greenbg)}
.slot.ok .n{background:var(--green)}
.slot.ko{border-color:var(--red);border-style:solid;background:var(--redbg)}
.aviso{flex:none;margin:14px 14px 0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;line-height:1.4;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.aviso.info{background:#fff;border:1px solid var(--border)}
.aviso.ko{background:var(--redbg);border:2px solid var(--red);color:var(--red)}
.aviso.win{background:var(--greenbg);border:2px solid var(--green);color:var(--green);font-size:18px}
.aviso.end{background:var(--dark);color:#fff}
.aviso.end b{color:var(--gold)}
@media(max-width:820px){
  body{height:auto}
  .board{grid-template-columns:1fr}
  .col{overflow:visible}
  .scroll{overflow:visible}
}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--red);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar"><div><div class="tt">ORDENA LA CRÓNICA</div><div class="ts">LLEVA CADA PÁRRAFO A SU CAJA</div></div><div class="me" id="me"></div></div>
<div id="main" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
<div id="toast"></div>
<script>
const API = location.origin + "/api/ordena";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const qs = new URLSearchParams(location.search);
let DEV = lsGet("ord_dev", "");
if (!DEV){ DEV = "d" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet("ord_dev", DEV); }
let CODE = (qs.get("c") || lsGet("ord_code", "")).toUpperCase();
let unido = !!CODE && lsGet("ord_joined", "") === CODE;
let S = null, pidiendo = false, enviando = false, desfase = 0;

// estado local del tablero
let ronda = "";          // código|crónica|inicio: cambia cuando el profesor arranca otra
let col = [];            // por caja: id del bloque o null
let marcas = [];         // por caja: true (verde), false (rojo) o null
let rojos = {};          // cajas en rojo tras corregir: no se mueven hasta pulsar «Sacar los rojos»
let verSolucion = false;
let fijos = {};          // cajas verdes que ya no se mueven
let ultimoEnviado = "";
let sel = null;          // bloque seleccionado con un toque

async function api(params){
  const r = await fetch(API, { method:"POST", body: JSON.stringify(Object.assign({ c: CODE, dev: DEV }, params)) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
// en casa la crónica es la de cada alumno
function norm(j){ if (j && j.game && j.game.modo === "casa" && j.me){ j.game.texto = j.me.texto; j.game.cronica = j.me.cronica; j.game.startedAt = j.me.inicio; } return j; }
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 3000); }
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

let MODO = "";   // "casa" si la partida es para hacer en casa
async function pintarEntrada(){
  $("me").innerHTML = "";
  if (CODE && !MODO){ try { const j = await api({ a:"state" }); MODO = j.game.modo; } catch(e){} }
  const casa = MODO === "casa", conCodigo = !!qs.get("c");
  $("main").innerHTML = `<div class="wrap"><div class="card"><h2 style="font-size:22px">${casa ? "Ordena la crónica" : "Entra en la partida"}</h2>
    ${casa ? `<p class="muted" style="margin-top:8px;line-height:1.5">Escribe tu nombre y empieza. Primero ordenarás la crónica 1 y después la 2. El reloj arranca en cuanto entras.</p>` : ""}
    <div${conCodigo ? ' style="display:none"' : ""}><label for="inC">Código de la partida</label><input id="inC" value="${esc(CODE)}" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em"></div>
    <label for="inN">${casa ? "Tu nombre y apellidos" : "Nombre del equipo"}</label><input id="inN" value="${esc(lsGet("ord_name", ""))}" maxlength="40" autocomplete="off" placeholder="${casa ? "Lucía Martín" : "Los de la última fila"}">
    <div style="margin-top:16px"><button class="btn b-red" id="bEntrar">${casa ? "Empezar" : "Entrar"}</button></div><div class="err" id="err"></div></div></div>`;
  const entrar = async () => {
    CODE = $("inC").value.trim().toUpperCase();
    const name = $("inN").value.trim();
    if (!CODE || !name) return $("err").textContent = casa ? "Escribe tu nombre" : "Escribe el código y el nombre del equipo";
    try { await api({ a:"join", name }); lsSet("ord_code", CODE); lsSet("ord_name", name); lsSet("ord_joined", CODE); unido = true; await refrescar(true); }
    catch(e){ $("err").textContent = e.message; }
  };
  $("bEntrar").onclick = entrar;
  $("inN").onkeydown = e => { if (e.key === "Enter") entrar(); };
}

async function refrescar(forzar){
  if (!unido || (pidiendo && !forzar) || arrastre) return;
  pidiendo = true;
  try {
    const j = await api({ a:"state" });
    if (!j.me){ unido = false; pintarEntrada(); return; }
    S = norm(j); desfase = Date.now() - j.now; pintar();
  }
  catch(e){ if (/No existe/.test(e.message)){ unido = false; pintarEntrada(); } }
  finally { pidiendo = false; }
}
setInterval(() => { if (!document.hidden) refrescar(); }, 1500 + Math.floor(Math.random() * 400));
setInterval(() => {
  if (!S || !$("clock")) return;
  const g = S.game;
  let ms = 0;
  if (S.me.fin) ms = S.me.ms;
  else if (g.status === "play") ms = Date.now() - desfase - g.startedAt;
  else if (g.status === "over") ms = (g.endedAt || g.startedAt) - g.startedAt;
  $("clock").textContent = mmss(ms);
}, 250);

let vistaEstado = "";
function pintar(){
  const g = S.game;
  MODO = g.modo;
  $("me").innerHTML = `<span>${g.modo === "casa" ? "" : "EQUIPO "}<b>${esc(S.me.name)}</b></span><span class="clock" id="clock">0:00</span>`;
  if (g.status === "lobby"){
    vistaEstado = "lobby";
    $("main").innerHTML = `<div class="wrap"><div class="card wait">Ya estáis dentro.<br><span class="muted">Esperad a que el profesor saque la crónica.</span></div></div>`;
    return;
  }
  const T = g.texto, clave = g.code + "|" + g.cronica + "|" + g.startedAt;
  if (ronda !== clave){
    ronda = clave;
    col = T.cajas.map(() => null); marcas = T.cajas.map(() => null); rojos = {}; verSolucion = false; fijos = {}; ultimoEnviado = ""; sel = null;
    try { const guardado = JSON.parse(lsGet("ord_col_" + clave, "null")); if (Array.isArray(guardado) && guardado.length === col.length) col = guardado; } catch(e){}
  }
  // lo que dice el servidor manda: cajas verdes fijas y la última corrección
  const F = S.me.fijos || {};
  Object.keys(F).forEach(i => { i = +i; const id = F[i]; const antes = col.indexOf(id); if (antes >= 0) col[antes] = null; col[i] = id; fijos[i] = true; delete rojos[i]; });
  // al recargar: si el tablero sigue como en la última corrección, los rojos siguen ahí esperando
  const U = S.me.ultimo;
  if (U && U.orden && U.orden.join(",") === col.join(",")) U.bien.forEach((b, i) => { if (!b) rojos[i] = true; });
  if (S.me.fin){ rojos = {}; T.cajas.forEach((_, i) => { fijos[i] = true; }); }
  if (g.status === "over" && g.solucion && !S.me.fin){
    col = g.solucion.slice(); verSolucion = true;
  }
  const est = g.status + "|" + S.me.fin + "|" + g.cronica;
  if (vistaEstado !== est || !$("board")){ vistaEstado = est; montar(); }
  else pintarAviso();
}

function montar(){
  const T = S.game.texto;
  const cab = `<div class="cab"><div class="medio">${esc(T.medio)}</div><h1>${esc(T.titulo)}</h1><p>${esc(T.subtitulo)}</p></div>`;
  $("main").innerHTML = `<div id="aviso"></div>
    <div class="board" id="board">
      <div class="col"><div class="ch">PÁRRAFOS DESORDENADOS <span id="quedan"></span></div><div class="scroll" id="sIzq">${cab}<div class="pool" id="pool"></div></div></div>
      <div class="col"><div class="ch">LA CRÓNICA EN ORDEN <span>arrastra cada párrafo a su caja</span></div><div class="scroll" id="sDer">${cab}<div id="slots" style="display:flex;flex-direction:column;gap:10px"></div></div></div>
    </div>`;
  tablero();
}

function bloque(id){ return S.game.texto.bloques.find(b => b.id === id); }
function htmlBloque(id, cls){
  const b = bloque(id);
  return `<div class="blk ${cls || ""}${sel === id ? " sel" : ""}" data-b="${esc(id)}"><span class="lt">${esc(id)}</span>${esc(b.texto)}</div>`;
}

function tablero(){
  const T = S.game.texto;
  marcas = col.map((id, i) => !id ? null : fijos[i] ? true : (rojos[i] && !verSolucion) ? false : null);
  const sueltos = T.bloques.map(b => b.id).filter(id => col.indexOf(id) < 0);
  $("pool").innerHTML = sueltos.length ? sueltos.map(id => htmlBloque(id)).join("")
    : `<div class="vacio">Ya están todos colocados</div>`;
  $("quedan").textContent = sueltos.length ? sueltos.length + " por colocar" : "";
  $("slots").innerHTML = T.cajas.map((lb, i) => {
    const m = marcas[i] === true ? " ok" : marcas[i] === false ? " ko" : "";
    return `<div class="slot${m}" data-s="${i}"><div class="sh"><span class="n">${i + 1}</span>${lb ? `<span class="lb">${esc(lb)}</span>` : ""}</div>
      ${col[i] ? htmlBloque(col[i], m.trim()) : `<div class="ph">Arrastra aquí un párrafo</div>`}</div>`;
  }).join("");
  pintarAviso();
}

function pintarAviso(){
  const g = S.game, el = $("aviso");
  if (!el) return;
  if (g.status === "over"){
    el.innerHTML = `<div class="aviso end"><span>${S.me.fin ? `Terminado. <b>Puesto ${S.me.puesto}</b> en ${mmss(S.me.ms)}.` : "Se acabó el tiempo."} A la derecha tenéis el orden bueno.</span></div>`;
    return;
  }
  const nInt = n => n + (n === 1 ? " intento" : " intentos");
  if (S.me.fin && g.modo === "casa"){
    if (S.me.siguiente) el.innerHTML = `<div class="aviso win"><span>✅ ${esc(g.texto.medio)} ordenada en ${mmss(S.me.ms)} · ${nInt(S.me.intentos)}. Descansa si quieres, el reloj de la ${esc(S.me.siguienteMedio.toLowerCase())} empieza cuando pulses el botón.</span><button class="btn b-red" id="bSig">Empezar la ${esc(S.me.siguienteMedio.toLowerCase())}</button></div>`;
    else {
      const R = S.me.resumen, total = R.reduce((t, x) => t + x.ms, 0);
      el.innerHTML = `<div class="aviso win"><span>🏆 ¡Terminado, ${esc(S.me.name)}! ${R.map(x => `${esc(x.medio)}: ${mmss(x.ms)} (${nInt(x.intentos)})`).join(" · ")} · <b>Total ${mmss(total)}</b></span></div>`;
    }
    return;
  }
  if (S.me.fin){
    el.innerHTML = `<div class="aviso win"><span>🏆 ¡Crónica ordenada! Puesto ${S.me.puesto} · ${mmss(S.me.ms)} · ${nInt(S.me.intentos)}</span></div>`;
    return;
  }
  const rojos = marcas.filter(m => m === false).length;
  if (rojos) el.innerHTML = `<div class="aviso ko"><span>${rojos} ${rojos === 1 ? "párrafo mal puesto" : "párrafos mal puestos"}. Leedlos bien y, cuando queráis, sacadlos para volver a colocarlos. Los verdes se quedan donde están.</span><button class="btn b-red" id="bSacar">Sacar los rojos</button></div>`;
  else el.innerHTML = `<div class="aviso info"><span>Arrastrad cada párrafo a su caja (o tocad un párrafo y luego la caja). Cuando estén todos puestos se corrige solo.</span><span class="muted" style="font-weight:400">${S.me.intentos ? S.me.intentos + (S.me.intentos === 1 ? " intento" : " intentos") : ""}</span></div>`;
}

function jugable(){ return S && S.game.status === "play" && !S.me.fin; }
function hayRojos(){ return Object.keys(rojos).length > 0; }
function sacarRojos(){
  Object.keys(rojos).forEach(i => { col[+i] = null; });
  rojos = {}; ultimoEnviado = ""; sel = null;
  lsSet("ord_col_" + ronda, JSON.stringify(col));
  tablero();
}
document.addEventListener("click", async e => {
  if (e.target.id === "bSacar") sacarRojos();
  if (e.target.id === "bSig"){ e.target.disabled = true; try { await api({ a:"siguiente" }); await refrescar(true); } catch(err){ toast(err.message); e.target.disabled = false; } }
});

function colocar(id, destino){   // destino: número de caja o null (volver a la izquierda)
  if (!jugable()) return;
  if (hayRojos()) return toast("Primero sacad los rojos");
  if (enviando) return;
  const desde = col.indexOf(id);
  if (desde >= 0 && fijos[desde]) return;
  if (destino !== null && fijos[destino]) return toast("Esa caja ya está bien, en verde");
  if (destino === desde) return;
  if (destino === null){ col[desde] = null; }
  else {
    const ocupa = col[destino];
    col[destino] = id;
    if (desde >= 0){ col[desde] = ocupa; }
  }
  sel = null;
  lsSet("ord_col_" + ronda, JSON.stringify(col));
  tablero();
  comprobar();
}

async function comprobar(){
  if (col.some(x => !x) || enviando) return;
  const firma = col.join(",");
  if (firma === ultimoEnviado) return;
  ultimoEnviado = firma; enviando = true;
  try {
    const j = await api({ a:"check", orden: col, cronica: S.game.cronica });
    j.bien.forEach((b, i) => { if (b) fijos[i] = true; else rojos[i] = true; });
    if (j.state){ S = norm(j.state); }
    tablero();
    if (j.fin) pintar();
  } catch(e){ ultimoEnviado = ""; toast(e.message); }
  finally { enviando = false; if (col.join(",") !== firma) comprobar(); }
}

// ── arrastrar (ratón, dedo o lápiz) y tocar para colocar ──
let arrastre = null;
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".blk");
  if (!b || !jugable()) return;
  if (hayRojos()){ if (!b.closest(".slot") || !fijos[+b.closest(".slot").dataset.s]) toast("Primero pulsad «Sacar los rojos»"); return; }
  const id = b.dataset.b, desde = col.indexOf(id);
  if (desde >= 0 && fijos[desde]) return;
  arrastre = { id, el: b, x0: e.clientX, y0: e.clientY, mov: false, clon: null, dx: 0, dy: 0, w: b.offsetWidth };
  const r = b.getBoundingClientRect(); arrastre.dx = e.clientX - r.left; arrastre.dy = e.clientY - r.top;
  b.setPointerCapture && b.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove", e => {
  if (!arrastre) return;
  if (!arrastre.mov){
    if (Math.hypot(e.clientX - arrastre.x0, e.clientY - arrastre.y0) < 7) return;
    arrastre.mov = true;
    const c = arrastre.el.cloneNode(true); c.classList.add("drag"); c.classList.remove("sel","ko"); c.style.width = arrastre.w + "px";
    document.body.appendChild(c); arrastre.clon = c; arrastre.el.classList.add("ghost");
  }
  arrastre.clon.style.left = (e.clientX - arrastre.dx) + "px";
  arrastre.clon.style.top = (e.clientY - arrastre.dy) + "px";
  marcarDestino(e.clientX, e.clientY);
  autoScroll(e.clientX, e.clientY);
});
function destinoEn(x, y){
  const el = document.elementFromPoint(x, y);
  if (!el) return undefined;
  const s = el.closest(".slot"); if (s) return +s.dataset.s;
  if (el.closest("#sIzq")) return null;
  return undefined;
}
function marcarDestino(x, y){
  document.querySelectorAll(".slot.over,.pool.over").forEach(n => n.classList.remove("over"));
  const d = destinoEn(x, y);
  if (d === null) $("pool").classList.add("over");
  else if (d !== undefined && !fijos[d]) document.querySelector(`.slot[data-s="${d}"]`).classList.add("over");
}
let scrollVel = 0, scrollCol = null;
function autoScroll(x, y){
  const el = document.elementFromPoint(x, y), sc = el && el.closest(".scroll");
  scrollVel = 0; scrollCol = null;
  const zona = 70;
  if (sc && getComputedStyle(sc).overflowY === "auto"){
    const r = sc.getBoundingClientRect();
    if (y < r.top + zona) scrollVel = -Math.ceil((r.top + zona - y) / 5);
    else if (y > r.bottom - zona) scrollVel = Math.ceil((y - (r.bottom - zona)) / 5);
    scrollCol = sc;
  } else {
    if (y < zona) scrollVel = -Math.ceil((zona - y) / 5);
    else if (y > innerHeight - zona) scrollVel = Math.ceil((y - (innerHeight - zona)) / 5);
  }
}
setInterval(() => { if (!arrastre || !arrastre.mov || !scrollVel) return; if (scrollCol) scrollCol.scrollTop += scrollVel; else scrollBy(0, scrollVel); }, 16);
function soltar(e){
  if (!arrastre) return;
  const a = arrastre; arrastre = null; scrollVel = 0;
  document.querySelectorAll(".slot.over,.pool.over").forEach(n => n.classList.remove("over"));
  if (a.mov){
    a.clon.remove(); a.el.classList.remove("ghost");
    const d = destinoEn(e.clientX, e.clientY);
    if (d !== undefined) colocar(a.id, d);
  } else {
    const s = a.el.closest(".slot");
    if (sel && sel !== a.id && s) return colocar(sel, +s.dataset.s);   // tocar un párrafo ya colocado lo cambia por el elegido
    sel = sel === a.id ? null : a.id;   // un toque selecciona; el siguiente toque en una caja lo coloca
    tablero();
  }
}
document.addEventListener("pointerup", soltar);
document.addEventListener("pointercancel", e => { if (arrastre){ if (arrastre.clon) arrastre.clon.remove(); arrastre.el.classList.remove("ghost"); arrastre = null; } });
document.addEventListener("click", e => {
  if (!sel || !jugable() || e.target.closest(".blk")) return;
  const s = e.target.closest(".slot");
  if (s) return colocar(sel, +s.dataset.s);
  if (e.target.closest("#sIzq")) return colocar(sel, null);
});

if (unido) refrescar(true); else pintarEntrada();
</script>
