<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serpientes y escaleras · Equipo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E9E6CB;color:#3C4A38;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
header{background:#F5F3E2;border-bottom:1px solid #CBD3BE;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:700}
header i{width:16px;height:16px;border-radius:50%;display:inline-block;flex-shrink:0}
header span{margin-left:auto;font-size:13px;color:#7B8C74;font-weight:600}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:22px;text-align:center;max-width:760px;width:100%;margin:0 auto}
h1{font-size:30px;color:#4A6244;line-height:1.1}
input{width:100%;max-width:340px;background:#F7F5E6;border:2px solid #C3CDB8;color:#3C4A38;padding:14px;border-radius:10px;font-size:18px;text-align:center;outline:none}
input:focus{border-color:#5C7A54}
#code{text-transform:uppercase;letter-spacing:8px;font-size:28px;font-weight:700}
.big{background:#5C7A54;color:#fff;border:none;padding:18px 40px;border-radius:14px;font-size:22px;font-weight:700;width:100%;max-width:340px}
.big:disabled{background:#BCC7B4}
#err{color:#A33B3B;min-height:20px;font-size:14px}
.sub{color:#7B8C74;font-size:15px}
.txt{font-size:24px;font-weight:700}
#preg{font-size:21px;line-height:1.4;font-weight:600}

#ops{display:grid;gap:10px;width:100%}
.op{display:flex;gap:12px;align-items:center;text-align:left;border:none;color:#fff;padding:16px;border-radius:12px;font-size:17px;font-weight:600;line-height:1.3}
.op b{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.op.A{background:#C0504D}.op.B{background:#3E79B4}.op.C{background:#C79A2B}.op.D{background:#4E9A5A}
.op.bien{outline:5px solid #2E7D32}.op.mal{outline:5px solid #A33B3B;opacity:.7}.op.ap{opacity:.3}
.res{font-size:30px;font-weight:800}
.hide{display:none!important}
#dadoV{font-size:80px}

#tab svg{width:100%;height:auto;display:block;border-radius:12px}
#marc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;font-size:13px;font-weight:700}
#marc span{padding:3px 10px;border-radius:12px;color:#fff}
#marc span.t{outline:3px solid #3C4A38}
</style></head><body>
<header><i id="dot" style="background:#C3CDB8"></i><div id="nom">Serpientes y escaleras</div><span id="cas"></span></header>
<main>
 <div id="vJoin">
  <h1>Entrar en la partida</h1>
  <div class="sub" style="margin:10px 0">Código que aparece en el proyector</div>
  <input id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off"><br><br>
  <input id="name" maxlength="22" placeholder="Nombre del equipo" autocomplete="off"><br><br>
  <button class="big" onclick="entra()">Entrar</button>
  <div id="err"></div>
 </div>
 <div id="vEsp" class="hide"><div class="txt" id="eT"></div><div class="sub" id="eS" style="margin-top:8px"></div></div>
 <div id="vRoll" class="hide"><div class="txt">¡Es vuestro turno!</div><div class="sub" id="tir"></div><br><button class="big" id="bRoll" onclick="S('roll')">🎲 Tirar el dado</button></div>
 <div id="vQ" class="hide">
   <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div style="flex:1;height:12px;border-radius:6px;background:#DDE3D0;overflow:hidden"><div id="tbar" style="height:100%;width:100%;background:#5C7A54"></div></div><div id="tnum" style="font-size:24px;font-weight:800;min-width:38px;text-align:right">30</div></div>
   <span id="cat"></span><div id="quien" class="sub" style="margin-top:8px"></div>
   <img id="pfoto" class="hide" alt="" style="width:170px;height:170px;object-fit:cover;border-radius:14px;margin:12px auto 0;display:block">
   <div id="preg" style="margin:12px 0"></div>
   <div id="ops"></div>
   <div id="pIn" class="hide"><input id="resp" maxlength="60" placeholder="Escribid el apellido" autocomplete="off"><br><br><button class="big" onclick="envia()">Enviar</button><div class="sub" style="margin-top:8px">Vale con el apellido</div></div>
 </div>
 <div id="vRes" class="hide"><div class="res" id="rT"></div><div class="sub" id="rS" style="margin-top:8px"></div></div>
</main>
<div id="tab" class="hide"><svg id="board" viewBox="0 0 1180 660" preserveAspectRatio="xMidYMid meet"></svg><div id="marc"></div></div>
<script>
let me=null,S_=null;
let equipos=[],pos=[];
const ESCALERAS = {3:22, 14:33, 11:30, 37:56};
const SERPIENTES = {17:6, 35:15, 52:31, 59:40};
/* ═══ GEOMETRÍA DEL CAMINO ═══ */
const NSQ=60, COLS=10, FILAS=6, X0=100, Y0=92, DX=108, DY=96;
function centro(n){
  const f=Math.floor((n-1)/COLS), c=(n-1)%COLS;
  const col = f%2===0 ? c : COLS-1-c;
  return {x:X0+col*DX, y:Y0+(FILAS-1-f)*DY};
}
const ANCHO=84;

function esq(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

/* ═══ DIBUJO DEL TABLERO ═══ */
function pintaTablero(){
  let h='';
  h+=`<defs>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4E8F2"/><stop offset="1" stop-color="#B6D3E6"/></linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3D66B"/><stop offset="1" stop-color="#D9A93A"/></linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2C3A2A" flood-opacity=".28"/></filter>
    <filter id="sombrita" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#2C3A2A" flood-opacity=".25"/></filter>
  </defs>`;
  h+=`<rect x="0" y="0" width="1180" height="660" rx="12" fill="#E9E6CB"/>`;
  h+=`<rect x="22" y="22" width="1136" height="616" rx="10" fill="url(#agua)"/>`;
  h+=`<rect x="22" y="22" width="1136" height="616" rx="10" fill="none" stroke="#fff" stroke-width="5"/>`;
  h+=`<rect x="10" y="10" width="1160" height="640" rx="12" fill="none" stroke="#fff" stroke-width="8"/>`;
  for(let i=0;i<12;i++){const y=50+i*52,x=40+((i*137)%1050);
    h+=`<path d="M${x},${y} q14,-8 28,0 t28,0" fill="none" stroke="#fff" stroke-width="2.4" opacity=".5" stroke-linecap="round"/>`;}
  /* casillas */
  const pares=['#A9C99A','#98BD89'];
  for(let n=1;n<=NSQ;n++){
    const p=centro(n);
    const fill=n===NSQ?'url(#oro)':(n===1?'#C9DDB8':pares[n%2]);
    h+=`<g filter="url(#sombrita)"><rect x="${p.x-47}" y="${p.y-43}" width="94" height="86" rx="13" fill="${fill}" stroke="#fff" stroke-width="3"/></g>`;
  }
  /* adornos */
  const T=[6,12,19,25,32,38,45,51,57];
  T.forEach((n,i)=>{const p=centro(n),y=p.y+30,t=i%3;
    if(t===0)h+=`<path d="M${p.x+14},${y} l8,-18 l8,18 z" fill="#5C7A54"/><path d="M${p.x+24},${y} l6,-13 l6,13 z" fill="#4E6B47"/>`;
    else if(t===1)h+=`<path d="M${p.x+8},${y} l11,-17 l6,9 l6,-12 l11,20 z" fill="#79A06F"/>`;
    else h+=`<circle cx="${p.x+16}" cy="${y-8}" r="7" fill="#5C7A54"/><rect x="${p.x+14.5}" y="${y-8}" width="3" height="9" fill="#5C7A54"/><circle cx="${p.x+28}" cy="${y-5}" r="5" fill="#4E6B47"/><rect x="${p.x+26.8}" y="${y-5}" width="2.4" height="7" fill="#4E6B47"/>`;
  });
  /* meta y salida */
  const s1=centro(1), sN=centro(NSQ);
  h+=`<text x="${s1.x}" y="${s1.y+33}" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="800" fill="#2F4A2C" letter-spacing="2">SALIDA</text>`;
  h+=`<g transform="translate(${sN.x},${sN.y-8})"><path d="M-12,18 V-22" stroke="#6B4A1E" stroke-width="3.5" stroke-linecap="round"/><path d="M-11,-22 H16 L9,-14 L16,-6 H-11 Z" fill="#C0392B"/></g>`;
  h+=`<text x="${sN.x}" y="${sN.y+33}" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="800" fill="#6B4A1E" letter-spacing="2">META</text>`;
  /* escaleras y serpientes */
  for(const a in ESCALERAS) h+=escalera(centro(+a),centro(ESCALERAS[a]));
  const tonos=[['#4C4A3A','#6B6850'],['#5A4030','#7C5A42'],['#3F4A35','#5E6B4E'],['#4A3A52','#6E5A7A'],['#5A3A3A','#8A5A5A'],['#33484F','#55737C']];
  Object.keys(SERPIENTES).forEach((a,i)=>{h+=serpiente(centro(+a),centro(SERPIENTES[a]),tonos[i%tonos.length]);});
  /* números en insignia, arriba a la izquierda */
  for(let n=1;n<=NSQ;n++){
    const p=centro(n);
    h+=`<circle cx="${p.x-31}" cy="${p.y-27}" r="12.5" fill="#fff" opacity=".92"/><text x="${p.x-31}" y="${p.y-22}" text-anchor="middle" font-family="Segoe UI,Arial" font-size="${n>=10?13:14}" font-weight="800" fill="${n%10===0?'#A33B3B':'#2F4A2C'}">${n}</text>`;
  }
  for(const a in ESCALERAS){const p=centro(+a);h+=etiqueta(p.x+8,p.y+36,'sube a '+ESCALERAS[a],'#3F7D3F');}
  for(const a in SERPIENTES){const p=centro(+a);h+=etiqueta(p.x+8,p.y+36,'baja a '+SERPIENTES[a],'#A33B3B');}
  h+=`<g id="tokens"></g>`;
  document.getElementById('board').innerHTML=h;
  pintaFichas();
}

function etiqueta(x,y,txt,color){
  const w=txt.length*5.8+14;
  return `<g><rect x="${x-w/2}" y="${y-9}" width="${w}" height="17" rx="8.5" fill="${color}" opacity=".95"/>`+
         `<text x="${x}" y="${y+3.4}" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10.5" font-weight="700" fill="#fff">${txt}</text></g>`;
}

function escalera(p1,p2){
  const dx=p2.x-p1.x, dy=p2.y-p1.y, L=Math.hypot(dx,dy);
  const ox=-dy/L*12, oy=dx/L*12;
  let g=`<g filter="url(#sombra)">`;
  g+=`<line x1="${p1.x+ox}" y1="${p1.y+oy}" x2="${p2.x+ox}" y2="${p2.y+oy}" stroke="#9A6B34" stroke-width="7" stroke-linecap="round"/>`;
  g+=`<line x1="${p1.x-ox}" y1="${p1.y-oy}" x2="${p2.x-ox}" y2="${p2.y-oy}" stroke="#9A6B34" stroke-width="7" stroke-linecap="round"/>`;
  g+=`<line x1="${p1.x+ox}" y1="${p1.y+oy}" x2="${p2.x+ox}" y2="${p2.y+oy}" stroke="#D9A860" stroke-width="3.5" stroke-linecap="round"/>`;
  g+=`<line x1="${p1.x-ox}" y1="${p1.y-oy}" x2="${p2.x-ox}" y2="${p2.y-oy}" stroke="#D9A860" stroke-width="3.5" stroke-linecap="round"/>`;
  const pasos=Math.max(4,Math.round(L/30));
  for(let i=0;i<=pasos;i++){
    const t=i/pasos, cx=p1.x+dx*t, cy=p1.y+dy*t;
    g+=`<line x1="${cx+ox}" y1="${cy+oy}" x2="${cx-ox}" y2="${cy-oy}" stroke="#B88445" stroke-width="5" stroke-linecap="round"/>`;
  }
  return g+`</g>`;
}
function serpiente(cab,cola,tono){
  const [c1,c2]=tono||['#4C4A3A','#6B6850'];
  const dx=cola.x-cab.x, dy=cola.y-cab.y, L=Math.hypot(dx,dy);
  const ux=dx/L, uy=dy/L, px=-uy, py=ux;
  const AMP=Math.min(46,L*0.20), CICLOS=2.15;
  const N=140, izq=[], der=[], eje=[];
  for(let i=0;i<=N;i++){
    const t=i/N;
    const on=Math.sin(t*Math.PI*2*CICLOS)*AMP*(1-t*0.25);
    const x=cab.x+ux*L*t+px*on, y=cab.y+uy*L*t+py*on;
    eje.push({x,y});
  }
  for(let i=0;i<=N;i++){
    const p=eje[i], q=eje[Math.min(N,i+1)], r=eje[Math.max(0,i-1)];
    let vx=q.x-r.x, vy=q.y-r.y; const m=Math.hypot(vx,vy)||1; vx/=m; vy/=m;
    const w=(11-8.4*Math.pow(i/N,0.8))/1;
    izq.push([p.x-vy*w, p.y+vx*w]);
    der.push([p.x+vy*w, p.y-vx*w]);
  }
  const d='M'+izq.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+
          ' L'+der.reverse().map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+' Z';
  let g=`<g filter="url(#sombra)">`;
  g+=`<path d="${d}" fill="${c1}"/>`;
  for(let i=10;i<N-14;i+=11){
    const p=eje[i], w=(11-8.4*Math.pow(i/N,0.8))*0.34;
    g+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${Math.max(1.2,w).toFixed(1)}" fill="${c2}" opacity=".8"/>`;
  }
  /* cabeza */
  const p0=eje[0], p1=eje[3];
  const ang=Math.atan2(p0.y-p1.y,p0.x-p1.x)*180/Math.PI;
  g+=`<g transform="translate(${p0.x.toFixed(1)},${p0.y.toFixed(1)}) rotate(${ang.toFixed(1)})">`;
  g+=`<ellipse cx="5" cy="0" rx="17" ry="12" fill="${c1}"/>`;
  g+=`<circle cx="9" cy="-5" r="3.4" fill="#fff"/><circle cx="9" cy="5" r="3.4" fill="#fff"/>`;
  g+=`<circle cx="10.4" cy="-5" r="1.6" fill="#1A1A14"/><circle cx="10.4" cy="5" r="1.6" fill="#1A1A14"/>`;
  g+=`<path d="M21,0 L33,0 M33,0 L40,-5 M33,0 L40,5" stroke="#C0392B" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  g+=`</g></g>`;
  return g;
}

/* ═══ FICHAS ═══ */
function pintaFichas(){
  const g=document.getElementById('tokens'); if(!g) return;
  let h='';
  const grupos={};
  equipos.forEach((e,i)=>{(grupos[pos[i]]=grupos[pos[i]]||[]).push(i);});
  Object.keys(grupos).forEach(k=>{
    const ids=grupos[k],n=ids.length,c=centro(+k);
    const filas=n<=3?1:(n<=8?2:3), cols=Math.ceil(n/filas);
    const esc=n<=3?0.8:(n<=6?0.62:0.52);
    const sp=Math.min(30,80/cols);
    ids.forEach((i,j)=>{
      const col=j%cols,fila=Math.floor(j/cols);
      const x=c.x+4+(col-(cols-1)/2)*sp, y=c.y+8+(fila-(filas-1)/2)*sp*0.95;
      const e=equipos[i];
      h+=`<g transform="translate(${x},${y}) scale(${esc})">
          <ellipse cx="0" cy="24" rx="15" ry="4" fill="#2C3A2A" opacity=".25"/>
          <circle r="21" fill="${e.c}" stroke="#fff" stroke-width="4"/>
          <circle cx="-6.5" cy="-4" r="4.4" fill="#fff"/><circle cx="6.5" cy="-4" r="4.4" fill="#fff"/>
          <circle cx="-6.5" cy="-4" r="2" fill="#2A2A22"/><circle cx="6.5" cy="-4" r="2" fill="#2A2A22"/>
          <path d="M-6,7 q6,5.5 12,0" stroke="#2A2A22" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        </g>`;
    });
  });
  g.innerHTML=h;
}

const API='/api/serpientes';const CID=Math.random().toString(36).slice(2)+Date.now().toString(36);let es=null,abierto=false;
function S(t,o){if(!abierto)return;fetch(API+'/msg',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({cid:CID,t},o||{}))}).catch(()=>{});}
function lee(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function guarda(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function conecta(){
  es=new EventSource(API+'/stream?cid='+CID);
  es.onopen=()=>{abierto=true;const c=lee('esc_c'),t=lee('esc_t');if(c&&t)S('join',{code:c,token:t});};
  es.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='err'){document.getElementById('err').textContent=m.m;return;}
    if(m.t==='hello'){me=m.id;guarda('esc_c',m.code);guarda('esc_t',m.token);}
    if(m.t==='state'){me=m.you||me;pinta(m);}
  };
  es.onerror=()=>{abierto=false;};
}
function entra(){
  const code=document.getElementById('code').value.trim().toUpperCase(),name=document.getElementById('name').value.trim();
  if(code.length<4){document.getElementById('err').textContent='Escribid el código de 4 letras';return;}
  if(!name){document.getElementById('err').textContent='Poned un nombre al equipo';return;}
  document.getElementById('err').textContent='';
  S('join',{code,name,token:null});
}
function ver(id){['vJoin','vEsp','vRoll','vQ','vRes'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));}
const LET='ABCD';
function envia(){const v=document.getElementById('resp').value;if(v.trim())S('ans',{text:v});}
function pinta(s){
  S_=s;
  const yo=s.teams.find(t=>t.id===me);if(!yo){ver('vJoin');document.getElementById('tab').classList.add('hide');return;}
  equipos=s.teams.map(x=>({n:x.name,c:x.color}));pos=s.teams.map(x=>x.pos);
  document.getElementById('tab').classList.remove('hide');pintaFichas();
  document.getElementById('marc').innerHTML=s.teams.map((x,i)=>'<span class="'+(i===s.turn&&s.phase!=='lobby'&&s.phase!=='end'?'t':'')+'" style="background:'+x.color+'">'+esq(x.name)+' · '+x.pos+'</span>').join('');
  document.getElementById('dot').style.background=yo.color;document.getElementById('nom').textContent=yo.name;
  document.getElementById('cas').textContent='Casilla '+yo.pos;
  const cur=s.teams[s.turn],mio=cur&&cur.id===me;tTot=s.tot||30000;
  const yaRobo=(s.sd||[]).includes(me);
  if(s.phase!=='question'&&s.phase!=='steal'){document.getElementById('ops').dataset.k='';document.getElementById('pIn').dataset.k='';}
  if(s.phase==='lobby'){ver('vEsp');eT.textContent='Estáis dentro';eS.textContent='Esperando a que el profesor empiece…';return;}
  if(s.phase==='end'){ver('vEsp');eT.textContent=s.winner!=null&&s.teams[s.winner].id===me?'🏆 ¡Habéis ganado!':'Ha ganado '+s.teams[s.winner].name;eS.textContent='';return;}
  if(s.phase==='roll'){
    if(mio){document.getElementById('tir').textContent='Tirada '+(s.rolls+1)+' de 4';ver('vRoll');document.getElementById('bRoll').disabled=false;}
    else{ver('vEsp');eT.textContent='Turno de '+cur.name;eS.textContent='Esperad vuestro turno';}
    return;
  }
  if(s.phase==='rolling'||s.phase==='moved'){ver('vEsp');eT.textContent=mio?'🎲 '+(s.dice||''):'Turno de '+cur.name;eS.textContent=mio?'Mirad el proyector':'';return;}
  if(s.phase==='steal'&&s.q&&(mio||yaRobo)){ver('vEsp');eT.textContent=mio?'No la habéis sabido':'Respuesta enviada';eS.textContent=mio?'El primer equipo que acierte avanza una casilla':'Esperad el resultado del rebote';return;}
  if((s.phase==='question'||s.phase==='steal')&&s.q){
    ver('vQ');
    const puede=s.phase==='question'?mio:true;
    const q=s.q;const cat={G:['Palabras de género','#A34A6B'],R:['Cómo se hace un reportaje','#3E7C8C'],P:['¿Quién es?','#B5762A']}[q.cat];
    const ce=document.getElementById('cat');ce.textContent=cat[0];ce.style.background=cat[1];
    document.getElementById('preg').textContent=q.text;
    document.getElementById('quien').textContent=s.phase==='steal'?'¡Rebote! '+cur.name+' no la sabe. Si acertáis los primeros, avanzáis una casilla':(mio?'Contestad vosotros':'Contesta '+cur.name);
    const ops=document.getElementById('ops'),pIn=document.getElementById('pIn'),ft=document.getElementById('pfoto');
    const clave=q.text+(puede?'1':'0');
    if(q.photo){ft.src=API+q.photo;ft.classList.remove('hide');}else ft.classList.add('hide');
    if(q.kind==='mc'){
      pIn.classList.add('hide');ops.classList.remove('hide');
      if(ops.dataset.k!==clave){ops.dataset.k=clave;ops.innerHTML='';q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='op '+LET[i]+(puede?'':' ap');b.innerHTML='<b>'+LET[i]+'</b>';const sp=document.createElement('span');sp.textContent=o;b.appendChild(sp);
        if(puede)b.onclick=()=>{ops.querySelectorAll('button').forEach(x=>x.disabled=true);S('ans',{i});};else b.disabled=true;ops.appendChild(b);});}
    }else{
      ops.classList.add('hide');
      if(puede){pIn.classList.remove('hide');if(pIn.dataset.k!==q.text){pIn.dataset.k=q.text;document.getElementById('resp').value='';}}
      else pIn.classList.add('hide');
    }
    tEnd=Date.now()+s.rem;reloj();
    return;
  }
  if(s.phase==='reveal'&&s.rev){
    ver('vRes');const rv=s.rev;
    if(rv.steal){
      const gane=rv.winners.includes(yo.name);
      if(gane){rT.textContent='✔ ¡Rebote acertado! +1 casilla';rT.style.color='#2E7D32';rS.textContent='';}
      else if(mio){rT.textContent=rv.timeout?'⏱ Se acabó el tiempo':'✘ Fallo';rT.style.color='#A33B3B';rS.textContent='Pasa el turno';}
      else{rT.textContent=rv.winners.length?rv.winners[0]+' ha acertado antes':'Nadie ha acertado el rebote';rT.style.color='#3C4A38';rS.textContent='';}
    }else{
      if(mio){rT.textContent='✔ ¡Correcto!';rT.style.color='#2E7D32';rS.textContent=rv.limit?'Tres tiradas seguidas: pasa el turno':'Volvéis a tirar';}
      else{rT.textContent=cur.name+' acierta';rT.style.color='#3C4A38';rS.textContent='';}
    }
    return;
  }
}
document.getElementById('resp').addEventListener('keydown',e=>{if(e.key==='Enter')envia();});
let tEnd=0,tTot=30000,tInt=null;
function reloj(){const f=()=>{const l=Math.max(0,tEnd-Date.now());const b=document.getElementById('tbar');b.style.width=(100*l/tTot)+'%';b.style.background=l<8000?'#A33B3B':'#5C7A54';document.getElementById('tnum').textContent=Math.ceil(l/1000);};f();if(!tInt)tInt=setInterval(f,200);}
const eT=document.getElementById('eT'),eS=document.getElementById('eS'),rT=document.getElementById('rT'),rS=document.getElementById('rS');
try{const c=new URLSearchParams(location.search).get('c');if(c)document.getElementById('code').value=c.toUpperCase().slice(0,4);}catch(e){}
pintaTablero();
conecta();
</script></body></html>
